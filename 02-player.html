<!-- 02-player.html - YouTube Jaisa Player -->
<style>
.playerWrap{max-width:900px;margin:0 auto;padding:0 10px}
.videoBox{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.videoBox video{width:100%;height:100%;object-fit:contain;background:#000}
.videoBox.shorts{aspect-ratio:9/16;max-width:420px;margin:0 auto}
.controls{position:absolute;left:0;right:0;bottom:0;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.progress{width:100%;height:5px;background:#444;border-radius:5px;cursor:pointer}
.progress div{height:100%;background:#FF6A00;width:0%}
.ctrlRow{display:flex;align-items:center;gap:10px;margin-top:6px;color:#fff;font-size:18px}
.ctrlRow button{background:transparent;border:0;color:#fff;font-size:18px}
.ctrlRow select{background:#222;color:#fff;border:0;border-radius:8px;padding:3px}
.time{font-size:12px;color:#ddd}
.spacer{flex:1}
.actionRow{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.actionRow button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px;white-space:nowrap}
.actionRow button.on{background:#FF6A00}
.chanRow{display:flex;align-items:center;gap:10px;padding:8px 0}
.chanRow img{width:40px;height:40px;border-radius:50%;background:#333}
.subBtn{background:#fff;color:#000;border:0;padding:8px 16px;border-radius:20px;font-weight:700}
.subBtn.subed{background:#333;color:#fff}
.commentBox{background:#111;border-radius:12px;padding:10px;margin-top:10px}
.commentBox input{width:100%;background:#222;border:0;outline:0;color:#fff;padding:10px;border-radius:20px}
.shortsNav{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.shortsNav button{background:rgba(0,0,0,.6);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px}
</style>

<div class="playerWrap" id="playerWrap">
<div class="videoBox" id="videoBox">
<video id="mainVideo" playsinline onclick="togglePlay()"></video>
<div class="shortsNav" id="shortsNav" style="display:none">
<button onclick="likeVideo()">❤️</button>
<button onclick="openComments()">💬</button>
<button onclick="shareVideo()">↗️</button>
<button onclick="nextShort()">⬇️</button>
</div>
<div class="controls" id="playerControls">
<div class="progress" onclick="seekVideo(event)"><div id="progBar"></div></div>
<div class="ctrlRow">
<button id="playBtn" onclick="togglePlay()">▶️</button>
<button onclick="skipVideo(-10)">⏪ 10</button>
<button onclick="skipVideo(10)">10 ⏩</button>
<span class="time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></span>
<span class="spacer"></span>
<button onclick="toggleMute()" id="muteBtn">🔊</button>
<select id="speedSel" onchange="changeSpeed(this.value)"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
<select id="qualitySel" onchange="changeQuality(this.value)"><option>Auto</option><option>720p</option><option>480p</option><option>360p</option></select>
<button onclick="toggleFull()">⛶</button>
</div>
</div>
</div>

<div class="actionRow">
<button id="likeBtn" onclick="likeVideo()">👍 Like <span id="likeCount">0</span></button>
<button id="dislikeBtn" onclick="dislikeVideo()">👎</button>
<button onclick="shareVideo()">↗️ Share</button>
<button onclick="downloadVideo()">⬇️ Download</button>
<button onclick="saveVideo()">💾 Save</button>
<button onclick="reportVideo()">🚩 Report</button>
</div>

<div class="chanRow">
<img id="chanImg" src="">
<div style="flex:1"><b id="chanName">Channel</b><br><small id="chanSubs">0 Subscribers</small></div>
<button class="subBtn" id="subBtn" onclick="subscribeChan()">Subscribe</button>
</div>

<h3 id="videoTitle" style="margin:6px 0">Video Title</h3>
<p id="videoDesc" style="color:#aaa;font-size:13px">Description...</p>

<div class="commentBox">
<b>Comments</b><br><br>
<input id="commentInput" placeholder="Comment likho...">
<button onclick="addComment()" style="margin-top:8px;background:#FF6A00;border:0;color:#fff;padding:8px 14px;border-radius:20px">Comment Karo</button>
<div id="commentList" style="margin-top:10px"></div>
</div>

<div id="upNext" style="margin-top:14px"><b>Up Next</b><div id="upNextList"></div></div>
</div>

<script>
let isShortMode=false;
function loadPlayer(v){
let video=document.getElementById('mainVideo');
video.src=v.url||""; document.getElementById('videoTitle').innerText=v.title||"";
document.getElementById('chanName').innerText=v.channel||"";
document.getElementById('likeCount').innerText=v.likes||0;
isShortMode=v.isShort||false;
document.getElementById('videoBox').className='videoBox'+(isShortMode?' shorts':'');
document.getElementById('shortsNav').style.display=isShortMode?'flex':'none';
document.getElementById('playerControls').style.display=isShortMode?'none':'block';
video.play(); document.getElementById('playBtn').innerText='⏸️';
}
function togglePlay(){let v=document.getElementById('mainVideo'); if(v.paused){v.play();document.getElementById('playBtn').innerText='⏸️'}else{v.pause();document.getElementById('playBtn').innerText='▶️'}}
function skipVideo(s){let v=document.getElementById('mainVideo'); v.currentTime+=s}
function toggleMute(){let v=document.getElementById('mainVideo'); v.muted=!v.muted; document.getElementById('muteBtn').innerText=v.muted?'🔇':'🔊'}
function changeSpeed(s){document.getElementById('mainVideo').playbackRate=parseFloat(s)}
function changeQuality(q){localStorage.setItem('bf_quality',q)}
function toggleFull(){let b=document.getElementById('videoBox'); if(document.fullscreenElement)document.exitFullscreen(); else b.requestFullscreen()}
function seekVideo(e){let bar=e.currentTarget; let r=bar.getBoundingClientRect(); let p=(e.clientX-r.left)/r.width; let v=document.getElementById('mainVideo'); v.currentTime=p*v.duration}
document.getElementById('mainVideo').addEventListener('timeupdate',function(){let v=this; if(!v.duration)return; document.getElementById('progBar').style.width=(v.currentTime/v.duration*100)+'%'; document.getElementById('curTime').innerText=fmtTime(v.currentTime); document.getElementById('durTime').innerText=fmtTime(v.duration)});
function fmtTime(s){s=Math.floor(s); return Math.floor(s/60)+":"+(s%60<10?"0":"")+(s%60)}
function likeVideo(){let b=document.getElementById('likeBtn'); b.classList.toggle('on')}
function dislikeVideo(){document.getElementById('dislikeBtn').classList.toggle('on')}
function shareVideo(){if(navigator.share)navigator.share({title:document.getElementById('videoTitle').innerText,url:location.href}); else alert('Link Copy Ho Gaya')}
function downloadVideo(){alert('Download Shuru')}
function saveVideo(){alert('Save Ho Gaya')}
function reportVideo(){togglePop('reportBox')}
function subscribeChan(){let b=document.getElementById('subBtn'); b.classList.toggle('subed'); b.innerText=b.classList.contains('subed')?'Subscribed':'Subscribe'}
function addComment(){let i=document.getElementById('commentInput'); if(!i.value.trim())return; let d=document.createElement('div'); d.style.cssText='padding:8px 0;border-bottom:1px solid #222'; d.innerText='👤 '+i.value; document.getElementById('commentList').prepend(d); i.value=''}
function openComments(){document.querySelector('.commentBox').scrollIntoView({behavior:'smooth'})}
function nextShort(){alert('Next Short')}
</script>
