<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch - BharatFlix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto}
body{max-width:390px;margin:0 auto;background:#000;color:#fff}
.header{padding:10px;background:#111;display:flex;gap:10px;align-items:center}
.video-box{width:100%;aspect-ratio:16/9;background:#000}
video{width:100%;height:100%}
.info{padding:12px;background:#111}
.back{cursor:pointer}
</style>
</head>
<body>
<div class="header"><div class="back" onclick="history.back()">←</div><b>BharatFlix Player 🇮🇳</b></div>
<div class="video-box"><video id="playVideo" controls autoplay playsinline></video></div>
<div class="info"><h3 id="vTitle">BharatFlix Video</h3><p style="font-size:12px;color:#aaa">BharatFlix Official • 1.2M Views</p></div>
<script>
let params=new URLSearchParams(location.search);
let url=params.get('url');
let title=params.get('title');
if(url) document.getElementById('playVideo').src=url;
if(title) document.getElementById('vTitle').innerText=title;
</script>
</body>
</html>
