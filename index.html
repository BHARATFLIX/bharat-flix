        // make one card as mini 4 grid like screenshot
        let mini=document.createElement('div'); mini.className='grid-card mini-grid';
        mini.innerHTML=`<div class="mini-grid-inner">${gridSlice.map(x=>`<video src="${x.video_url}" muted></video>`).join('')}</div><span class="hash-bottom">#foryou</span><span class="more">⋮</span>`;
        mini.onclick=()=>openPlayer(v.video_url, v.title);
        grid.appendChild(mini);
      }else{
        let card=document.createElement('div'); card.className='grid-card';
        let label = i==0 ? 'New' : (v.category||'#edit');
        card.innerHTML=`<div class="grid-card-thumb"><video src="${v.video_url}" muted loop playsinline></video><span class="top-label">${label}</span><span class="more">⋮</span><span class="hash-bottom">#${(v.category||'edit').toLowerCase()}</span></div>`;
        card.onclick=()=>openPlayer(v.video_url, v.title);
        grid.appendChild(card);
      }
    });
    // prevent duplicate if mini used
    if(grid.children.length>4) grid.innerHTML=""; // safety
    if(grid.children.length==0){
      gridSlice.slice(0,4).forEach(v=>{
        let card=document.createElement('div'); card.className='grid-card';
        card.innerHTML=`<div class="grid-card-thumb"><video src="${v.video_url}" muted></video><span class="top-label">${v.category||'New'}</span><span class="hash-bottom">#${(v.category||'edit').toLowerCase()}</span><span class="more">⋮</span></div>`;
        card.onclick=()=>openPlayer(v.video_url, v.title);
        grid.appendChild(card);
      });
    }
    feed.appendChild(grid);
    // auto play grid videos
    grid.querySelectorAll('video').forEach(vid=>{
      let obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting) vid.play().catch(()=>{}); else vid.pause()})},{threshold:0.3});
      obs.observe(vid);
    });
  }
  // 4. LONG CARDS - remaining all as YouTube long cards like LIVE Hanuman
  let longSlice = allVideos.length>9 ? allVideos.slice(9) : allVideos.slice(1);
  longSlice.forEach(v=>{
    let isLive = (v.category||'').toLowerCase()=='live' || Math.random()>0.7;
    let dur = isLive ? '50:56' : Math.floor(Math.random()*59+1)+':'+String(Math.floor(Math.random()*60)).padStart(2,'0');
    let card=document.createElement('div'); card.className='long-card';
    card.innerHTML=`<div class="long-thumb"><video src="${v.video_url}" muted playsinline></video>${isLive?`<span class="live-badge">((•)) LIVE</span>`:""}<span class="duration">${dur}</span></div><div class="long-info"><div class="long-avatar"><img src="logo.png?v=50"><span class="live-dot">LIVE</span></div><div class="long-text"><b>${v.title} | ${v.description? v.description.substring(0,60) : 'BharatFlix Official Video'} | Nee...</b><div class="meta"><span>${v.category||'Relax Dhun'}</span><span class="dot"></span><span>▷59K</span><span class="dot"></span><span>Streamed 10h ago</span></div></div><div class="long-more">⋮</div></div>`;
    card.onclick=()=>openPlayer(v.video_url, v.title);
    feed.appendChild(card);
    let vid=card.querySelector('video');
    let obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting) vid.play().catch(()=>{}); else vid.pause()})},{threshold:0.5});
    obs.observe(vid);
  });
}
function showEmpty(){ renderYTFeed(); }
let hardTimeout=setTimeout(()=>{ let el=document.getElementById('videoFeed'); if(el && el.innerHTML.includes('लोड')) showEmpty(); },2000);
async function loadFromGodam(){
  try{
    if(!supa){ clearTimeout(hardTimeout); showEmpty(); return; }
    let {data,error}=await supa.from('videos').select('*').order('created_at',{ascending:false}).limit(30);
    clearTimeout(hardTimeout);
    if(error) throw error;
    if(!data||data.length==0){ showEmpty(); return; }
    allVideos=data; shortsVideos=data;
    renderYTFeed();
  }catch(e){ clearTimeout(hardTimeout); console.error(e); showEmpty(); }
}
loadFromGodam();
setTimeout(()=>{ let el=document.getElementById('videoFeed'); if(el && el.innerHTML.includes('लोड')) showEmpty(); },3500);
document.getElementById('chips').onclick=e=>{ let chip=e.target.closest('.chip'); if(!chip) return; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); let cat=chip.innerText.trim(); if(cat=='All'||cat=='🧭'){ renderYTFeed(); return; } let filtered=allVideos.filter(v=> (v.category||'').toLowerCase().includes(cat.toLowerCase())); let prev=allVideos; allVideos=filtered.length?filtered:prev; renderYTFeed(); allVideos=prev; toast('Filter: '+cat); };

document.getElementById('finalUploadBtn').onclick=async()=>{
  if(!selectedFile) return; let t=document.getElementById('v_title').value.trim(), d=document.getElementById('v_desc').value.trim(), c=document.getElementById('v_category').value; if(!t||!d) return toast('Title+Desc जरूरी');
  let prog=document.getElementById('uploadProgress'); prog.style.display='block'; prog.innerText='⏳ 50% Upload...';
  try{ let name=Date.now()+'_'+selectedFile.name.replace(/[^a-zA-Z0-9.]/g,'_'); let {error}=await supa.storage.from('videos').upload(name, selectedFile); if(error) throw error; prog.innerText='⏳ 80% Link...'; let {data}=supa.storage.from('videos').getPublicUrl(name); let url=data.publicUrl; prog.innerText='⏳ 90% Save...'; try{ let {error}=await supa.from('videos').insert([{title:t,description:d,category:c,video_url:url}]); if(error) throw error; }catch(e){ let {error}=await supa.from('videos').insert([{title:t,video_url:url}]); if(error) throw error; } prog.innerText='✅ Save!'; setTimeout(()=>{document.getElementById('uploadDetails').style.display='none'; prog.style.display='none'},1000); allVideos.unshift({title:t,description:d,category:c,video_url:url}); renderYTFeed(); toast('✅ Save '+c+' 🇮🇳');
  }catch(e){ prog.innerText='❌ '+e.message; toast('❌ '+e.message); }
};
