<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BHARAT FLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#0f0f0f;color:#fff}
#gate1,#gate2{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#111;border:2px solid #ff9933;border-radius:22px;padding:26px;width:100%;max-width:380px;text-align:center}
.logo{width:120px;height:120px;border-radius:22px;border:3px solid gold;object-fit:cover;background:#fff}
.btn{width:100%;padding:14px;border-radius:30px;font-weight:700;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.white{background:#fff;color:#000;border:2px solid gold}.green{background:#25D366;color:#fff;display:none}
.tricolor-line{height:4px;background:linear-gradient(90deg,#ff9933,#fff,#138808);margin:12px 0}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(90deg,#ff9933 0%,#ffffff22 20%,#000 50%,#13880822 90%);border-bottom:3px solid #ff9933;position:sticky;top:0}
.top img{width:34px;height:34px;border-radius:8px}
.search{flex:1;background:#121212;border:1px solid #333;border-radius:20px;padding:8px 14px;display:flex}
.search input{background:transparent;border:none;color:#fff;width:100%;outline:none}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 12px}
.chips span{background:#272727;padding:6px 12px;border-radius:8px;font-size:12px;white-space:nowrap}.active{background:#fff!important;color:#000!important}
.card{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #1a1a1a}
.thumb{width:168px;height:94px;background:#212121;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px}
.info{flex:1;text-align:left}.info h4{font-size:14px}.info p{font-size:11px;color:#aaa;margin-top:4px}
</style>
</head>
