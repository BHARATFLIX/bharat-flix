<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix - Final Lock 85%</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#f5f5f5;font-family:system-ui}
.header{background:#fff;padding:12px 14px;border-radius:0 0 18px 18px;box-shadow:0 2px 10px #0001}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-row img{width:52px;height:58px}
.bharat{font-size:42px;font-weight:900;background:linear-gradient(90deg,#FF9933 0 33%,#fff 33% 66%,#138808 66% 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1px #000;filter:drop-shadow(0 3px 0 #000) drop-shadow(2px 2px 4px #0005)}
.top-bar{display:flex;justify-content:flex-end;gap:18px;font-size:22px;padding:8px 4px}
.video-box{width:96%;margin:14px auto;background:#000;border-radius:18px;aspect-ratio:9/11;position:relative;overflow:hidden}
.action-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#fff;white-space:nowrap;scrollbar-width:none}
.action-scroll::-webkit-scrollbar{display:none}
.action-scroll button{flex:0 0 auto;border:1px solid #e5e5e5;background:#f2f2f2;padding:8px 14px;border-radius:20px;font-weight:600;font-size:13px}
.action-scroll.sub{background:#ff0000;color:#fff;border:none}
.sensor-row{display:flex;gap:8px;padding:12px;overflow-x:auto;background:#fff;margin-top:8px}
.sensor{flex:0 0 auto;padding:8px 12px;border-radius:12px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.s1{background:#d1fae5;color:#065f46}.s2{background:#dbeafe;color:#1e40af}.s3{background:#fde7f8;color:#6b21a8}.s4{background:#ffedd5;color:#9a3412}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd}
</style>
</head>
<body>

<div class="header">
  <div class="logo-row">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg">
    <div class="bharat">BharatFlix</div>
  </div>
  <div class="top-bar">🔍 🔔 ⚙️ 📤 <span style="background:#3b82f6;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center">B</span></div>
</div>

<div class="video-box" id="videoBox">
  <img id="previewImg" style="width:100%;height:100%;object-fit:contain;display:none">
  <div id="mapPlace">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" style="position:absolute;width:100%;height:100%;object-fit:contain;opacity:0.15">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
      <div style="width:85%;aspect-ratio:0.85;background:linear-gradient(to bottom,#FF9933 33%,white 33%,white 66%,#138808 66%);-webkit-mask:url('https://upload.wikimedia.org/wikipedia/commons/8/86/India_map.svg') no-repeat center/contain;mask:url('https://upload.wikimedia.org/wikipedia/commons/8/86/India_map.svg') no-repeat center/contain;display:flex;align-items:center;justify-content:center">
        <div style="width:38%;aspect-ratio:1;background:#0b3d91;border-radius:50%;display:flex;align-items:center;justify-content:center">☸️</div>
      </div>
    </div>
  </div>
  <button style="position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:76px;height:76px;background:#ff0000;border:none;border-radius:50%;color:#fff;font-size:32px">▶</button>
  <div style="position:absolute;bottom:8px;left:10px;color:#fff;font-size:12px;background:#0008;padding:4px 8px;border-radius:8px">0:42 / 5:18 • LIVE • 1.2M views</div>
</div>

<div style="background:#fff;padding:12px"><b>Independence Day Special | Rise of United India</b><br><small style="color:#666">BharatFlix • 2.8M subscribers • #India #Tiranga</small></div>

<!-- 10-12 BUTTONS SCROLL -->
<div class="action-scroll">
  <button>👍 Like 42K</button><button>👎 Dislike</button><button>↗️ Share</button><button>⬇️ Download</button><button>💰 Thanks</button><button>✂️ Clip</button><button>🔖 Save</button><button>🎬 Remix</button><button>🚩 Report</button><button class="sub">🔔 Subscribe</button><button>👥 Join</button><button>⋯ More</button>
</div>

<!-- AI SENSOR STATUS -->
<div class="sensor-row">
  <div class="sensor s1">🛡️ Copyright Protected</div>
  <div class="sensor s2">💧 Watermark ON</div>
  <div class="sensor s3">🧠 Clean Content AI</div>
  <div class="sensor s4">🚫 Public Block ON</div>
</div>

<div style="background:#fff;margin:8px;padding:12px;border-radius:12px">
  <b>📤 Upload (AI Check के साथ)</b><br>
  <input type="file" id="videoInput" accept="video/*" style="margin-top:10px">
  <p id="status" style="margin-top:8px;font-size:12px;color:#d00"></p>
</div>

<div style="height:80px"></div>
<div class="bottom"><div>🏠<br>Home</div><div>◍<br>Shorts</div><div>➕<br>Upload+</div><div>📺<br>Subs</div><div>👤<br>Profile</div></div>

<script>
// ====== 85% AI SENSORS - FINAL LOCK ======
const badWords = ["xxx","porn","nude","sex","gali"]; // गंदी वीडियो रोक
const copyrightList = ["tseries","yrf","sony"]; // कॉपीराइट चेक

document.getElementById('videoInput').addEventListener('change', function(e){
  const file = e.target.files[0]; if(!file) return;
  const name = file.name.toLowerCase();
  const status = document.getElementById('status');

  // 1. CLEAN CONTENT AI - गंदी वीडियो ब्लॉक
  if(badWords.some(w=>name.includes(w))){ status.innerText="❌ AI Sensor: गंदी / गलत वीडियो Block कर दी गई!"; return; }

  // 2. COPYRIGHT SENSOR
  if(copyrightList.some(w=>name.includes(w))){ status.innerText="❌ Copyright Sensor: ये वीडियो कॉपीराइट है, Upload नहीं होगी!"; return; }

  // 3. WATERMARK SENSOR - सब पर BharatFlix लोगो लगेगा
  status.innerText="✅ AI Check OK! Watermark लग रहा है... Upload जारी है";

  // Preview दिखाना
  const url = URL.createObjectURL(file);
  document.getElementById('previewImg').src=url;
  document.getElementById('previewImg').style.display='block';
  document.getElementById('mapPlace').style.display='none';

  // यहाँ बाद में 15% वाला गोदाम (1TB) कनेक्शन जुड़ेगा
  console.log("BharatFlix Watermark + Copyright + Clean Check PASS");
});
</script>
</body>
</html>
