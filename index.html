<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix - Look Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#f5f5f5;font-family:system-ui}
.header{background:#fff;padding:12px 14px;border-radius:0 0 18px 18px;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:100}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-row img{width:52px;height:58px}
.bharat{font-size:42px;font-weight:900;background:linear-gradient(90deg,#FF9933 0 33%,#fff 33% 66%,#138808 66% 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1px #000;filter:drop-shadow(0 3px 0 #000) drop-shadow(2px 2px 4px #0005)}
.top-bar{display:flex;justify-content:flex-end;gap:18px;font-size:22px;padding:8px 4px}
.video-box{width:96%;margin:14px auto;background:#000;border-radius:18px;aspect-ratio:16/9;max-height:260px;position:relative;overflow:hidden}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd;z-index:99}
.bottom div{cursor:pointer;text-align:center;font-size:12px}
#myAd{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#myAd video{width:100%;height:100%;object-fit:contain}
#closeBox{position:absolute;bottom:25px;left:0;width:100%;text-align:center}
.skip{background:#fff;color:#000;border:none;padding:10px 25px;border-radius:30px;font-weight:bold;font-size:16px;margin:3px}
#installBtn{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#FF9933,#FF6A00 50%,#138808);color:#fff;border:2px solid #fff;padding:14px 32px;border-radius:50px;font-size:17px;font-weight:900;box-shadow:0 5px 20px #0008;z-index:90;display:none;animation:pop 1s infinite}
@keyframes pop{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1)}}
</style>
</head>
<body>

<!-- AD + INSTALL - NO CHANGE -->
<div id="myAd">
  <video id="adVideo" autoplay muted playsinline><source src="ad-new.mp4" type="video/mp4"></video>
  <div id="closeBox">
    <button class="skip" onclick="unmuteAd()" style="background:#FF9933;color:#fff">🔊 आवाज चालू करें</button>
    <button class="skip" onclick="closeAd()">Skip Ad ✕</button>
    <p id="timerText" style="color:#fff;margin-top:8px;font-size:13px">Ad 25 सेकंड में बंद होगा...</p>
  </div>
</div>
<button id="installBtn">📲 BharatFlix Install करें</button>

<!-- HEADER - LOGO NO CHANGE - STICKY -->
<div class="header">
  <div class="logo-row">
    <img src="logo.png">
    <div class="bharat">BharatFlix</div>
  </div>
  <div class="top-bar"><span>🔍</span> <span>🔔</span> <span>⚙️</span> <span style="background:#3b82f6;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center">B</span></div>
</div>

<!-- VIDEO BOX - SMALL -->
<div class="video-box">
  <img src="logo.png" style="position:absolute;width:100%;height:100%;object-fit:contain;opacity:0.15">
  <div style="position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:76px;height:76px;background:#ff0000;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px">▶</div>
</div>

<div style="height:80px"></div>
<!-- BOTTOM - ONLY 1 UPLOAD BUTTON -->
<div class="bottom"><div>🏠<br>Home</div><div>◍<br>Shorts</div><div onclick="document.getElementById('videoInput').click()">➕<br>Upload+</div><div>📺<br>Subs</div><div>👤<br>Profile</div></div>
<input type="file" id="videoInput" accept="video/*" style="display:none">

<script>
let t=25;let ad=document.getElementById('myAd');let adVideo=document.getElementById('adVideo');
function unmuteAd(){ adVideo.muted=false; adVideo.volume=1.0; adVideo.play(); }
ad.addEventListener('click',unmuteAd);
adVideo.onended=function(){ closeAd(); };
let timer=setInterval(()=>{t--;let tx=document.getElementById('timerText');if(tx)tx.innerText="Ad "+t+" सेकंड में बंद होगा...";if(t<=0){closeAd()}},1000);
function closeAd(){ad.style.display='none';clearInterval(timer);adVideo.pause();}
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none';}
});
</script>
</body>
</html>
