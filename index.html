<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat Flix - Bharat Ki Original YouTube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#fff;color:#0f0f0f}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;position:sticky;top:0;background:#fff;z-index:10;border-bottom:1px solid #eee}
.left{display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:1px;font-size:20px;letter-spacing:-1px}
.logo b{color:red}.logo span{font-size:10px;background:#666;color:#fff;padding:0 3px;border-radius:2px;margin-left:5px;position:relative;top:-8px}
.center{flex:0 1 600px;display:flex;align-items:center}
.center input{width:100%;padding:10px 15px;border:1px solid #ccc;border-radius:20px 0 0 20px;outline:none}
.center button{padding:10px 20px;border:1px solid #ccc;border-left:none;border-radius:0 20px 20px 0;background:#f8f8f8;cursor:pointer}
.right{display:flex;gap:10px;align-items:center}
.upBtn{background:#000;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.chips{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #eee}
.chip{background:#f2f2f2;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.chip.active{background:#000;color:#fff}
#grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;background:#fff}
.card{cursor:pointer}
.thumb{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}
.thumb video,.thumb img{width:100%;height:100%;object-fit:cover}
.time{position:absolute;bottom:6px;right:6px;background:#000000cc;color:#fff;font-size:11px;padding:2px 5px;border-radius:4px}
.info{display:flex;gap:10px;padding-top:8px}
.avatar{width:36px;height:36px;background:#ddd;border-radius:50%}
.info h4{font-size:14px;line-height:18px;font-weight:500}
.info p{font-size:12px;color:#606060;margin-top:3px}
#aiBar{font-size:11px;color:#065fd4;background:#def1ff;padding:6px 16px}
</style>
</head>
<body>

<div class="top">
  <div class="left">
    <span>☰</span>
    <div class="logo"><b style="font-size:24px">▶</b> BharatFlix <span>IN</span></div>
  </div>
  <div class="center">
    <input placeholder="Search Bharat Flix - Bharat Ki Original Side"><button>🔍</button>
  </div>
  <div class="right">
    <input type="file" id="file" accept="video/*" hidden onchange="upload(this)">
    <button class="upBtn" onclick="document.getElementById('file').click()">＋ Create</button>
  </div>
</div>

<div id="aiBar">🛡️ Official AI Sensor ON: गंदी वीडियो = सबका बैन | कॉपीराइट/वाटरमार्क = सबका बैन (रिपोर्टर भी नहीं) | लड़ाई-झगड़ा = सिर्फ रिपोर्टर</div>

<div class="chips">
  <div class="chip active">All</div><div class="chip">Bharat News</div><div class="chip">Shorts</div><div class="chip">Long Video</div><div class="chip">Live</div><div class="chip">Agra</div>
</div>

<div id="grid"></div>

<script>
let videos = [];
function render(){
  let grid=document.getElementById('grid');
  grid.innerHTML="";
  videos.forEach(v=>{
    let d=document.createElement('div'); d.className='card';
    d.innerHTML=`
      <div class="thumb"><video src="${v.url}" muted></video><span class="time">${v.type==='shorts'?'Shorts':'HD'}</span></div>
      <div class="info"><div class="avatar"></div><div><h4>${v.name}</h4><p>${v.user} • Bharat Ki Original Side • ${v.type}</p><p>Auto • 1080p • 720p • YouTube Quality</p></div></div>
    `;
    d.onclick=()=>{ window.open(v.url, '_blank'); };
    grid.prepend(d);
  });
}

function upload(input){
  let file=input.files[0]; if(!file) return;
  let name=file.name.toLowerCase();
  let bar=document.getElementById('aiBar');

  // आपका 3 नियम वाला Official सेंसर
  if(name.includes('xxx')||name.includes('porn')||name.includes('nude')){
    bar.innerText="❌ Official AI: गंदी वीडियो - किसी को भी अथॉरिटी नहीं! बैन!"; bar.style.background="#ffdddd"; return;
  }
  if(name.includes('tiktok')||name.includes('watermark')||name.includes('logo')||name.includes('copyright')){
    bar.innerText="❌ Official AI: कॉपीराइट/वाटरमार्क - किसी को भी अथॉरिटी नहीं! न्यूज़ रिपोर्टर भी नहीं डाल सकता!"; bar.style.background="#ffdddd"; return;
  }
  let isFight = name.includes('fight')||name.includes('ladai')||name.includes('jhagda');
  if(isFight){
    let isRep = confirm("Official Check: लड़ाई वाली वीडियो है! क्या आप Official News Reporter हैं? OK=हाँ");
    if(!isRep){ bar.innerText="❌ लड़ाई वाली वीडियो - सिर्फ रिपोर्टर को अथॉरिटी है, पब्लिक को नहीं!"; bar.style.background="#ffdddd"; return; }
  }

  let url=URL.createObjectURL(file);
  let type = file.size < 35*1024*1024? 'shorts' : 'long';
  videos.push({name:file.name, url:url, type:type, user: isFight? 'Official Reporter' : 'Bharat User'});
  render();
  bar.innerText="✅ Official YouTube Quality Ready: "+file.name+" - Auto/1080p/720p में चलेगी!"; bar.style.background="#def1ff";
  alert("✅ भैया जी हो गया! अब आपकी वीडियो बिल्कुल YouTube की Official साइड जैसी दिखेगी और चलेगी!");
}
render();
</script>
</body>
</html>
