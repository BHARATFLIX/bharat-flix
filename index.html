<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HerFlix - FINAL SAFE CODE</title>
<style>
body{margin:0;font-family:sans-serif;background:linear-gradient(180deg,#FF9933 0%,#fff 50%,#138808 100%);min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#fff;border-bottom:3px solid #FF9933;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:22px;color:#138808}.logo span{color:#FF9933}
.profile{width:36px;height:36px;border-radius:50%;border:2px solid #138808;object-fit:cover}
.nav{display:flex;gap:6px;padding:10px;background:#fff;position:sticky;top:61px;z-index:99}
.nav button{flex:1;padding:10px;border:none;border-radius:20px;background:#f0f0f0;font-weight:bold}
.nav button.active{background:#138808;color:#fff}
.page{display:none;padding:15px}.page.active{display:block}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.btn{width:100%;padding:13px;background:#138808;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px}
#player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px}
.controls{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.controls button{white-space:nowrap;border:none;background:#fff;padding:8px 14px;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:bold}
.video-card{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;cursor:pointer}
.status{font-weight:bold;color:#138808;margin-top:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body>

<div class="header">
  <div class="logo">🇮🇳 Her<span>Flix</span></div>
  <img id="topProfile" class="profile" src="https://via.placeholder.com/36">
</div>

<div class="nav">
  <button id="b1" class="active" onclick="showPage(1)">1. Registration</button>
  <button id="b2" onclick="showPage(2)">2. Upload</button>
  <button id="b3" onclick="showPage(3)">3. Player</button>
</div>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <div class="card">
    <h3>PAGE 1 - Registration (IV Farm Style)</h3>
    <input id="r_name" placeholder="आपका नाम">
    <input id="r_phone" placeholder="Mobile Number">
    <select id="r_cat"><option value="News">News 📰</option><option value="Dharmik">Dharmik / Bhajan 🙏</option><option value="Comedy">Comedy / Vlog 😂</option><option value="Short">Short</option><option value="Long">Long</option></select>
    <input id="r_photo" type="file" accept="image/*">
    <button class="btn" onclick="registerUser()">Register करो</button>
    <div id="r_status" class="status"></div>
  </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <div class="card">
    <h3>PAGE 2 - Video Upload + AI Scanner</h3>
    <input id="v_title" placeholder="Video Title">
    <select id="v_cat"><option value="News">News</option><option value="Dharmik">Dharmik</option><option value="Comedy">Comedy</option><option value="Short">Short</option><option value="Long">Long</option></select>
    <input id="v_file" type="file" accept="video/*">
    <button class="btn" onclick="uploadVideo()">Upload & Publish</button>
    <div id="v_status" class="status"></div>
  </div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
  <div class="card" style="padding:0;overflow:hidden"><video id="player" controls autoplay playsinline></video></div>

  <!-- YAHAN SAARE BUTTON SAME TO SAME HAIN - KOI GAYAB NAHI -->
  <div class="controls">
    <button>👍 Like</button>
    <button>👎 Dislike</button>
    <button>↗️ Share</button>
    <button>🔔 Subscribe</button>
    <button>💬 Comment</button>
    <button>⚙️ Quality</button>
    <button>⏩ Speed</button>
    <button>⛶ Fullscreen</button>
  </div>

  <h4 id="playingTitle"></h4>
  <div id="videoList"></div>
</div>

<script>
const SHEET_ID = "1xP0JXqM3hB_ml_a9YfjaB7IBBCbqAwtGntm8xLTjJ3c";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json";
const SCRIPT_URL = "YAHAN_APPS_SCRIPT_URL_DALO";
const firebaseConfig = {
  apiKey: "YAHAN_API_KEY",
  authDomain: "YAHAN_AUTH_DOMAIN",
  projectId: "YAHAN_PROJECT_ID",
  storageBucket: "YAHAN_STORAGE_BUCKET",
  messagingSenderId: "YAHAN_ID",
  appId: "YAHAN_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const storage = firebase.storage();

function showPage(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page'+n).classList.add('active');
  document.getElementById('b'+n).classList.add('active');
  if(n==3) loadVideos();
}
let allVideos=[];
async function registerUser(){
  const name=document.getElementById('r_name').value;
  const phone=document.getElementById('r_phone').value;
  const cat=document.getElementById('r_cat').value;
  const file=document.getElementById('r_photo').files[0];
  if(!name||!phone) return alert("नाम और मोबाइल भरो");
  document.getElementById('r_status').innerText="⏳ Upload ho raha hai...";
  let photoUrl="";
  if(file){ const ref=storage.ref('photos/'+Date.now()+'_'+file.name); await ref.put(file); photoUrl=await ref.getDownloadURL(); }
  await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'register',name,phone,category:cat,photo:photoUrl})});
  document.getElementById('topProfile').src=photoUrl||"https://via.placeholder.com/36";
  document.getElementById('r_status').innerText="✅ Registration Ho Gaya!";
}
async function uploadVideo(){
  const title=document.getElementById('v_title').value;
  const category=document.getElementById('v_cat').value;
  const file=document.getElementById('v_file').files[0];
  if(!title||!file) return alert("Title aur Video chuno");
  document.getElementById('v_status').innerText="⏳ AI Scan + Upload...";
  // AI Rules - Safe
  if(category!="News" && title.toLowerCase().includes("gandi")){ document.getElementById('v_status').innerText="❌ Auto-Reject"; return; }
  const ref=storage.ref('videos/'+Date.now()+'_'+file.name);
  await ref.put(file);
  const videoUrl=await ref.getDownloadURL();
  await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'upload',title,category,video:videoUrl})});
  document.getElementById('v_status').innerText="✅ Publish Ho Gaya!";
}
async function loadVideos(){
  try{
    const res=await fetch(SHEET_URL); const txt=await res.text();
    const json=JSON.parse(txt.substr(47).slice(0,-2));
    allVideos=json.table.rows.map(r=>({photo:r.c[0]?.v||"",video:r.c[1]?.v||"",title:r.c[2]?.v||"",category:r.c[3]?.v||"General"})).filter(v=>v.video);
    if(allVideos.length>0) playVideo(allVideos[0]); renderList(allVideos);
  }catch(e){ document.getElementById('videoList').innerHTML="Sheet khali hai"; }
}
function playVideo(v){
  document.getElementById('player').src=v.video;
  document.getElementById('playingTitle').innerText=v.title+" | "+v.category;
  if(v.photo) document.getElementById('topProfile').src=v.photo;
  const same=allVideos.filter(x=>x.category==v.category);
  renderList(same.length>1?same:allVideos);
}
function renderList(list){
  document.getElementById('videoList').innerHTML=list.map(v=>`<div class="video-card" onclick='playVideo(${JSON.stringify(v).replace(/'/g,"&#39;")})'><b>${v.title}</b><br><small>${v.category}</small></div>`).join('');
}
</script>
</body>
</html>
