<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHARAT FLIX - YouTube Jaisi Site</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:99;background:#000;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:2.5px solid orange}
.logo-left{display:flex;align-items:center;gap:10px}
.logo-left img{width:52px;height:52px;border-radius:50%;border:2px solid gold;background:#fff;object-fit:cover}
.logo-text{line-height:1.1;font-weight:900}
.logo-text b{color:orange;font-size:22px;display:block}
.logo-text span{color:#fff;font-size:22px;display:block}
#installBtn{background:linear-gradient(180deg,#222,#000);color:#fff;border:1.5px solid #555;border-radius:30px;padding:4px 12px 4px 4px;display:flex;align-items:center;gap:7px;font-weight:bold;font-size:13px}
#installBtn img{width:32px;height:32px;border-radius:50%;border:1.5px solid gold;background:#fff}
.search-box{margin:10px;padding:10px 14px;background:#1a1a1a;border-radius:25px;display:flex;gap:10px}
.search-box input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:15px}
.ad-box{margin:12px;border:1.5px dashed orange;border-radius:12px;padding:10px;text-align:center;background:#1a1100;color:orange;font-size:13px}
.ad-box video{width:100%;max-height:130px;border-radius:8px;margin-top:8px}
.card{background:#1e1e1e;margin:12px;border-radius:18px;overflow:hidden;border:1px solid #333}
.thumb{width:100%;height:190px;background:linear-gradient(180deg,#ff9933 0%,#ffffff 50%,#138808 100%);display:flex;align-items:center;justify-content:center;position:relative}
.thumb::after{content:"🎵";font-size:60px}
.live{position:absolute;top:10px;left:10px;background:red;color:#fff;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:bold}
.card-body{padding:10px}
.title{font-weight:bold;font-size:15px}
.meta{color:#aaa;font-size:12px;margin:4px 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:#2a2a2a;border:0;color:#fff;padding:6px 12px;border-radius:20px;font-size:13px}
.btn.sub{background:red;font-weight:bold}
.upload-box{margin:12px;padding:14px;background:#1a1a1a;border-radius:12px;border:1px solid #333}
.upload-box h3{margin-bottom:8px;color:orange;font-size:16px}
.upload-box input{width:100%;padding:9px;margin:5px 0;border-radius:6px;border:0;background:#000;color:#fff}
.upload-box button{width:100%;padding:11px;background:orange;color:#000;font-weight:900;border:0;border-radius:8px;margin-top:8px;font-size:16px}
.rule{font-size:12px;color:#ccc;margin:6px 0;text-align:left}
</style>
</head>
<body>
<header>
  <div class="logo-left"><img src="icon.png"><div class="logo-text"><b>BHARAT</b><span>FLIX</span></div></div>
  <button id="installBtn"><img src="icon.png"><span>★4.9<br>Install App</span></button>
</header>
<div class="search-box">🔍<input id="search" placeholder="गाना, वीडियो सर्च करें..." onkeyup="searchVideo()"></div>
<div class="ad-box">📢 AD SPACE - आपका Ad यहाँ चलेगा<video autoplay muted loop playsinline controls><source src="ad (1).mp4" type="video/mp4"></video></div>
<div id="videoList"></div>
<div class="upload-box">
<h3>📤 अपना Video Upload करें</h3>
<input id="uName" placeholder="आपका नाम *">
<input id="uMobile" placeholder="मोबाइल नंबर *">
<input id="vTitle" placeholder="वीडियो का टाइटल *">
<input id="vLink" placeholder="Dropbox Video Link (?dl=1 वाला) *">
<div class="rule"><label><input type="checkbox" id="rule"> मैं कसम खाता/खाती हूँ - गंदा, चोरी का, कॉपीराइट वीडियो नहीं डालूँगा/डालूँगी</label></div>
<input id="vPass" placeholder="Admin Password - Bharat123 *">
<button onclick="addVideo()">🚀 Upload करें - Bharat Flix पर डालें</button>
<p style="font-size:10px;color:#888;margin-top:6px">* नाम, मोबाइल, टाइटल सब Bharat Flix पर दिखेगा</p>
</div>
<script>
let videos=JSON.parse(localStorage.getItem('bharat_videos')||'null')||[
{title:"न्यू भोजपुरी गाना 2026 - Trending",views:1250,likes:500,dislikes:10,subs:false,comments:0,link:"",name:"Bharat Flix"},
{title:"हरियाणवी DJ Song 2026",views:980,likes:320,dislikes:5,subs:false,comments:0,link:"",name:"Bharat Flix"},
{title:"भक्ति गाना - Hanuman Bhajan",views:2100,likes:890,dislikes:2,subs:false,comments:0,link:"",name:"Bharat Flix"}
];
function render(list){
let h="";list.forEach((v,i)=>{
h+=`<div class="card"><div class="thumb" onclick="playVideo('${v.link}')"><div class="live">● LIVE</div></div><div class="card-body"><div class="title">${v.title}</div><div class="meta">By ${v.name||'User'} • ${v.views} views • <span style="color:gold">★4.9</span></div><div class="actions"><button class="btn" onclick="addView(${i})">👁️ ${v.views}</button><button class="btn" onclick="addLike(${i})">👍 ${v.likes}</button><button class="btn" onclick="addDislike(${i})">👎 ${v.dislikes}</button><button class="btn sub" onclick="toggleSub(${i})">${v.subs?'Subscribed ✓':'Subscribe'}</button><button class="btn" onclick="shareVideo()">Share</button><button class="btn" onclick="addComment(${i})">💬 ${v.comments}</button></div></div></div>`;
});document.getElementById('videoList').innerHTML=h;
}
function addView(i){videos[i].views++;save();render(videos)}
function addLike(i){videos[i].likes++;save();render(videos)}
function addDislike(i){videos[i].dislikes++;save();render(videos)}
function toggleSub(i){videos[i].subs=!videos[i].subs;save();render(videos)}
function addComment(i){let c=prompt("Comment लिखें:");if(c){videos[i].comments++;save();render(videos)}}
function shareVideo(){navigator.clipboard.writeText(location.href);alert("Link Copied भैया जी!")}
function playVideo(l){if(l){window.open(l,'_blank')}else{alert("Dropbox Link डालने पर वीडियो यहाँ चलेगा भैया जी!")}}
function addVideo(){
let n=document.getElementById('uName').value;
let m=document.getElementById('uMobile').value;
let t=document.getElementById('vTitle').value;
let l=document.getElementById('vLink').value.replace('?dl=0','?dl=1');
let r=document.getElementById('rule').checked;
let p=document.getElementById('vPass').value;
if(!n||!m||!t||!l){alert("भैया जी, नाम, मोबाइल, टाइटल, लिंक सब भरना जरूरी है!");return}
if(!r){alert("भैया जी, नियम वाला टिक करना जरूरी है!");return}
if(p!=="Bharat123"){alert("Password गलत! Bharat123 डालें");return}
videos.unshift({title:t,views:1,likes:0,dislikes:0,subs:false,comments:0,link:l,name:n,mobile:m});
save();render(videos);alert("हो गया भैया जी! आपका वीडियो Bharat Flix पर आ गया! 🎉");
}
function searchVideo(){let q=document.getElementById('search').value.toLowerCase();let f=videos.filter(v=>v.title.toLowerCase().includes(q));render(f);}
function save(){localStorage.setItem('bharat_videos',JSON.stringify(videos))}
let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
document.getElementById('installBtn').onclick=()=>{if(dp){dp.prompt()}else{alert('Install के लिए ऊपर 3 बिंदु ⋮ > Add to Home screen दबाएं भैया जी')}};
render(videos);
</script>
</body>
</html>
