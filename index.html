<!-- BHARAT FLIX - FINAL CODE - VERSION 7.6 - ACCOUNT JARURI - DIRECT INSTALL - NO TRANSLATE - DATE: 19-11-2026 - FINAL LOCK -->
<!DOCTYPE html><html lang="hi" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="description" content="Bharat Flix - Bharat ka Apna Video App. Account banao, Channel banao, Video dalo."><title>Bharat Flix 🇮🇳</title><link rel="icon" href="logo.png"><link rel="manifest" href="manifest.json"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}body{max-width:480px;margin:0 auto;background:#fff;padding-bottom:85px;overflow-x:hidden}
.header{position:sticky;top:0;background:#fff;z-index:1003;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:8px;display:flex;align-items:center;gap:8px}
.logo{width:38px;height:38px;border-radius:50%;border:2px solid gold;cursor:pointer;object-fit:cover}
.logo.installing{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hTitle{font-size:20px;font-weight:900} .hTitle b{color:#f5b301}
.chipBar{display:flex;gap:6px;overflow-x:auto;padding:8px;white-space:nowrap}.chip{padding:6px 12px;border-radius:16px;background:#f2f2f2;font-size:13px;cursor:pointer}.chip.on{background:#000;color:#fff}
.card{padding:8px;cursor:pointer}.card img{width:100%;border-radius:10px}.card h4{font-size:14px;margin:5px 0 2px}.card p{font-size:12px;color:#666}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee;z-index:1003}.bottom div{text-align:center;font-size:11px;cursor:pointer}
.page{display:none;padding:10px}.page.on{display:block}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}button{padding:10px 14px;border:none;border-radius:8px;background:#000;color:#fff;font-weight:700;cursor:pointer;width:100%;margin:6px 0}.gold{background:#f5b301;color:#000}
.hide{display:none!important}.lockMsg{background:#fff3cd;padding:12px;border-radius:10px;text-align:center;font-weight:700;margin:10px}
</style></head>
<body class="notranslate">

<!-- HEADER - SAME LOOK -->
<div class="header">
<img src="logo.png" id="installBtn" class="logo" title="Install">
<div class="hTitle">Bharat <b>Flix</b> 🇮🇳</div>
<div style="margin-left:auto;display:flex;gap:10px;font-size:20px"><span onclick="showPage('searchPage')">🔍</span><span>🔔</span><span onclick="showPage('settingsPage')">⚙️</span></div>
</div>

<div class="chipBar"><span class="chip on">All</span><span class="chip">Music</span><span class="chip">Mixes</span><span class="chip">Live</span><span class="chip">Comedy</span><span class="chip">Bhakti</span><span class="chip">Gaming</span></div>

<!-- HOME -->
<div id="homePage" class="page on">
<div id="videoFeed"></div>
</div>

<!-- SEARCH -->
<div id="searchPage" class="page"><input id="searchInput" placeholder="Search..."><div id="searchRes"></div></div>

<!-- SETTINGS - LOOK SAME, LANGUAGE FROM SETTING -->
<div id="settingsPage" class="page">
<h3>Settings ⚙️</h3>
<label>App Language - App Ki Bhasha</label>
<select id="appLang" onchange="changeLang(this.value)">
<option value="hi">Hindi - हिन्दी</option><option value="en">English</option><option value="bho">Bhojpuri</option><option value="bn">Bengali - বাংলা</option><option value="ta">Tamil - தமிழ்</option><option value="te">Telugu - తెలుగు</option><option value="mr">Marathi - मराठी</option><option value="pa">Punjabi - ਪੰਜਾਬੀ</option>
</select>
<label>Dark Mode</label><select id="darkMode"><option>Off</option><option>On</option></select>
<label>Autoplay</label><select><option>On</option><option>Off</option></select>
<label>Quality</label><select><option>Auto</option><option>720p</option><option>1080p</option></select>
<p style="font-size:12px;color:#666;margin-top:10px">Monetization: 1000 Subs + 4000 Hours</p>
</div>

<!-- YOU - ACCOUNT -> CHANNEL -> STUDIO -->
<div id="youPage" class="page">
<h3 id="youTitle">You</h3>

<!-- STEP 1 : ACCOUNT - 1 PHOTO -->
<div id="accountBox">
<h4>1. Account Banao 👤</h4>
<img id="accPrev" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid gold">
<input type="file" id="accPhoto" accept="image/*" onchange="previewImg(this,'accPrev')">
<input id="accName" placeholder="Full Name *">
<input id="accEmail" placeholder="Email *">
<input id="accPass" type="password" placeholder="Password *">
<input id="accMobile" placeholder="Mobile *">
<input id="accDob" type="date">
<select id="accGender"><option>Male</option><option>Female</option><option>Other</option></select>
<button class="gold" onclick="createAccount()">Account Banao ✅</button>
</div>

<!-- STEP 2 : CHANNEL - ALAG PHOTO - ACCOUNT KE BAAD HI -->
<div id="channelBox" class="hide">
<h4>2. Channel Banao 📺</h4>
<img id="chPrev" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid #f5b301">
<input type="file" id="chPhoto" accept="image/*" onchange="previewImg(this,'chPrev')">
<input id="chName" placeholder="Channel Name *">
<input id="chHandle" placeholder="@Handle *">
<textarea id="chDesc" placeholder="Channel Description"></textarea>
<select id="chCat"><option>Music</option><option>Comedy</option><option>Bhakti</option><option>Gaming</option><option>News</option><option>Education</option></select>
<button class="gold" onclick="createChannel()">Channel Banao ✅</button>
</div>

<!-- STEP 3 : UPLOAD + STUDIO - VIDEO KE BAAD HI -->
<div id="studioBox" class="hide">
<h4>3. Studio 📊</h4>
<p id="studioStats">Views: 0 | Subs: 0 | Videos: 0</p>
<input id="vTitle" placeholder="Video Title *">
<textarea id="vDesc" placeholder="Video Description"></textarea>
<select id="vCat"><option>Music</option><option>Comedy</option><option>Bhakti</option><option>Gaming</option></select>
<input type="file" id="vFile" accept="video/*">
<button onclick="uploadVideo()">Video Upload Karo 📤</button>
<div id="myVideos"></div>
</div>
</div>

<div class="bottom">
<div onclick="showPage('homePage')">🏠<br>Home</div>
<div onclick="showPage('searchPage')">🎬<br>Shorts</div>
<div onclick="checkUpload()">➕<br>Upload</div>
<div>📺<br>Subs</div>
<div onclick="showPage('youPage')">👤<br>You</div>
</div>

<script>
let deferredPrompt=null, isInstalled=false, hasAccount=localStorage.getItem('bf_account')?true:false, hasChannel=localStorage.getItem('bf_channel')?true:false, hasVideo=localStorage.getItem('bf_video')?true:false;

// DIRECT INSTALL - NO CHROME POPUP - LOGO DABAO -> INSTALLING -> HOME SCREEN
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
document.getElementById('installBtn').onclick=async()=>{
  if(isInstalled){toast('App Pehle Se Installed Hai ✅');return;}
  if(!deferredPrompt){toast('Installing... 📲');return;}
  let btn=document.getElementById('installBtn'); btn.classList.add('installing'); btn.title='Installing...';
  deferredPrompt.prompt(); let {outcome}=await deferredPrompt.userChoice;
  btn.classList.remove('installing');
  if(outcome=='accepted'){isInstalled=true; toast('Install Ho Gaya ✅ - Home Screen Par Aa Gaya');}
  deferredPrompt=null;
};
window.addEventListener('appinstalled',()=>{isInstalled=true; toast('Home Screen Par Aa Gaya ✅');});

// LANGUAGE - SETTING SE - GOOGLE WALA NAHI
function changeLang(l){localStorage.setItem('bf_lang',l); toast('Language Badal Gayi ✅'); applyLang(l);}
function applyLang(l){
  let t={hi:{you:'You',search:'Search'},en:{you:'You',search:'Search'}};
  // Yahan se pura App us language me badlega - Setting se
}
let savedLang=localStorage.getItem('bf_lang')||'hi'; document.getElementById('appLang').value=savedLang;

// ACCOUNT GATE - BINA ACCOUNT APP NAHI CHALEGI
function needAccount(){ if(!hasAccount){ alert('कृपया पहले Account बनाएं, App को Install करें 🙏\nPlease Create Account First'); showPage('youPage'); return true;} return false;}
function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('on')); document.getElementById(id).classList.add('on'); refreshFlow(); window.scrollTo(0,0);}
function refreshFlow(){
  if(!hasAccount){ document.getElementById('accountBox').classList.remove('hide'); document.getElementById('channelBox').classList.add('hide'); document.getElementById('studioBox').classList.add('hide'); }
  else if(!hasChannel){ document.getElementById('accountBox').classList.add('hide'); document.getElementById('channelBox').classList.remove('hide'); document.getElementById('studioBox').classList.add('hide'); }
  else { document.getElementById('accountBox').classList.add('hide'); document.getElementById('channelBox').classList.add('hide'); document.getElementById('studioBox').classList.remove('hide'); }
}
function previewImg(inp,imgId){ let r=new FileReader(); r.onload=e=>document.getElementById(imgId).src=e.target.result; r.readAsDataURL(inp.files[0]);}
function createAccount(){
  if(!document.getElementById('accName').value||!document.getElementById('accEmail').value){alert('Name aur Email Bharo');return;}
  localStorage.setItem('bf_account',document.getElementById('accName').value); hasAccount=true; toast('Account Ban Gaya ✅ - Ab Channel Banao'); refreshFlow();
}
function createChannel(){
  if(!document.getElementById('chName').value){alert('Channel Name Bharo');return;}
  localStorage.setItem('bf_channel',document.getElementById('chName').value); hasChannel=true; toast('Channel Ban Gaya ✅ - Ab Video Dalo'); refreshFlow();
}
function checkUpload(){ if(needAccount())return; if(!hasChannel){alert('Pehle Channel Banao'); showPage('youPage'); return;} showPage('youPage');}
function uploadVideo(){
  if(!document.getElementById('vTitle').value){alert('Video Title Bharo');return;}
  localStorage.setItem('bf_video','1'); hasVideo=true; toast('Video Upload Ho Gayi ✅ - Studio Khul Gaya'); document.getElementById('myVideos').innerHTML+='<div class="card"><b>'+document.getElementById('vTitle').value+'</b><p>Views: 0 | Likes: 0</p></div>';
}
function toast(m){ let d=document.createElement('div'); d.textContent=m; d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:20px;z-index:9999;font-size:13px'; document.body.appendChild(d); setTimeout(()=>d.remove(),2500);}

// VIDEO FEED - TOUCH KARO TO ACCOUNT CHECK
let videos=[{t:'Bharat Flix - Welcome Video 🇮🇳',c:'Bharat Flix',v:'1.2K views'},{t:'Bhakti Song - Best Collection',c:'Bhakti',v:'5K views'},{t:'Comedy - Haso Hasao',c:'Comedy',v:'10K views'}];
function renderFeed(){
  document.getElementById('videoFeed').innerHTML=videos.map((v,i)=>`<div class="card" onclick="playVideo(${i})"><img src="logo.png"><h4>${v.t}</h4><p>${v.c} • ${v.v}</p></div>`).join('');
}
function playVideo(i){ if(needAccount())return; toast('Video Chal Rahi Hai ▶️ - '+videos[i].t); }
renderFeed(); refreshFlow();
</script>
</body></html>
