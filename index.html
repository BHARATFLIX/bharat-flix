<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix 🇮🇳</title>
<link rel="icon" href="logo.png?v=25">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
body{max-width:480px;margin:0 auto;background:#fff;padding-bottom:85px;overflow-x:hidden}

/* HEADER */
.header{position:sticky;top:0;background:#fff;z-index:1002;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:20px}
.logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff;border:1px solid #eee}
.b{color:#FF9933}.f{color:#138808}
.header-icons{display:flex;align-items:center;gap:10px}
.icon{width:36px;height:36px;background:#f2f2f2;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.install{background:#0b57d0;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:900;font-size:12px;cursor:pointer}
.install.green{background:#138808}
.header-bottom{padding:0 10px 8px 10px}
.search-wrap{width:100%;display:flex;align-items:center;background:#f1f1f1;border-radius:24px;padding:2px 4px 2px 8px;border:1px solid #e0e0e0;cursor:pointer}
.search-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#606060}
.search-wrap input{flex:1;background:transparent;border:none;outline:none;font-size:15px;padding:10px 0;color:#000;pointer-events:none}

/* YOUTUBE JAISA PLAYER - SAME TO SAME - NO CUT */
.video-wrap{
  position:sticky;
  top:0;
  width:100%;
  background:#000;
  z-index:999;
  margin:0;
  padding:0;
  line-height:0;
}
.video{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  position:relative;
  overflow:hidden;
}
.video video{
  width:100%;
  height:100%;
  display:block;
  background:#000;
  object-fit:contain !important; /* YOUTUBE JAISA - CUT NAHI HOGA */
  object-position:center;
}
.play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:68px;height:68px;background:rgba(0,0,0,.7);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;z-index:2;cursor:pointer;border:2px solid rgba(255,255,255,0.8)
}
#skipBox{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.9);color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;display:none;z-index:5}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;display:none;z-index:9999;max-width:90%;text-align:center}
.info{padding:10px 14px}.title{font-size:16px;font-weight:700;line-height:1.35}
.meta{display:flex;align-items:center;gap:10px;margin-top:10px}
.b-logo{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#fff;border:1px solid #eee}
.b-logo img{width:100%;height:100%;object-fit:cover}
.ch-name{flex:1;font-size:13px;line-height:1.2}
.btns{display:flex;gap:6px}.btns button{padding:8px 16px;border-radius:22px;border:none;font-weight:800;font-size:12px;cursor:pointer}
.sub{background:#FF0000;color:#fff}.join{background:#000;color:#fff}
.swipe{display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none}.swipe::-webkit-scrollbar{display:none}
.swipe div{flex:0 0 auto;background:#f2f2f2;border-radius:22px;padding:9px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;border:1px solid #e5e5e5}
.feed{padding:8px}.v-card{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee;cursor:pointer}.v-card video{width:168px;height:94px;border-radius:12px;object-fit:cover;background:#000}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:998}
.btm-item{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#606060;cursor:pointer;gap:2px;padding:4px 10px}.btm-item.active{color:#000;font-weight:700}
.upload{background:linear-gradient(90deg,#FF9933,#138808);width:50px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:900}
.btm-profile{width:28px;height:28px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;border:1px solid #ddd;font-size:16px;overflow:hidden}
.btm-profile img{width:100%;height:100%;object-fit:cover}
#pop{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:rgba(0,0,0,.75);z-index:10000;display:none;align-items:center;justify-content:center}
.pop-box{background:#fff;width:92%;border-radius:18px;padding:18px;max-height:92%;overflow-y:auto}
#voicePop{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:rgba(0,0,0,.6);z-index:13000;display:none;align-items:center;justify-content:center}
.voice-box{background:#fff;width:220px;height:220px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#searchPage{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:#fff;z-index:12000;display:none;flex-direction:column}
.search-page-header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #eee}
.back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.search-page-input-wrap{flex:1;display:flex;align-items:center;background:#f1f1f1;border-radius:24px;padding:2px 8px;border:1px solid #ddd}
.search-page-input-wrap input{flex:1;background:transparent;border:none;outline:none;font-size:16px;padding:10px 6px}
.mic-page{width:36px;height:36px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#uploadDetails{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:#fff;z-index:14000;display:none;flex-direction:column;padding:14px;overflow-y:auto}
.profile-upload-wrap{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding:10px;background:#f9f9f9;border-radius:12px;border:1px dashed #ccc}
.profile-preview{width:70px;height:70px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;border:2px solid #FF9933}
.profile-preview img{width:100%;height:100%;object-fit:cover}
#rotateHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:#fff;padding:16px 20px;border-radius:12px;font-size:14px;z-index:15000;display:none;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo"><img src="logo.png?v=25"><span><span class="b">Bharat</span><span class="f">Flix</span></span></div>
    <div class="header-icons">
      <div class="icon" id="bellBtn">🔔</div>
      <div class="icon" id="setBtn">⚙️</div>
      <button class="install green" id="installBtn">📲 Install</button>
    </div>
  </div>
  <div class="header-bottom">
    <div class="search-wrap" id="searchWrap">
      <div class="search-icon">🔍</div>
      <input placeholder="Search BharatFlix" readonly>
    </div>
  </div>
</div>

<!-- YOUTUBE JAISA PLAYER - AB CUT NAHI HOGA -->
<div class="video-wrap">
  <div class="video">
    <video id="myVideo" poster="logo.png?v=25" controls playsinline preload="metadata"></video>
    <div class="play" id="playBtn">▶</div>
    <div id="skipBox"></div>
  </div>
</div>

<div id="toast"></div>
<div id="searchPage"><div class="search-page-header"><div class="back-btn" id="backSearch">←</div><div class="search-page-input-wrap"><input id="searchPageInput" placeholder="Search BharatFlix"><div class="mic-page" id="micPageBtn">🎙️</div></div></div></div>
<div id="voicePop"><div class="voice-box"><div style="font-size:70px">🎙️</div><div style="font-size:13px;font-weight:800;margin-top:8px;color:#FF0000">● Listening...</div></div></div>
<div id="pop"><div class="pop-box" id="popContent"></div></div>
<div id="rotateHint">📱 फोन तिरछा करो<br>Full Screen के लिए</div>

<div id="uploadDetails">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>📤 Video Upload</b><span id="closeUploadDetails" style="background:#000;color:#fff;padding:6px 12px;border-radius:20px;cursor:pointer">✕</span></div>
  <input id="v_title" placeholder="Video Title *" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px">
  <textarea id="v_desc" placeholder="Description *" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;height:80px"></textarea>
  <select id="v_category" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px"><option>Comedy</option><option>Music</option><option>Bhakti</option><option>News</option><option>Education</option><option>Gaming</option><option>Vlog</option><option>Tech</option><option>Other</option></select>
  <button id="finalUploadBtn" style="width:100%;padding:14px;background:linear-gradient(90deg,#FF9933,#138808);color:#fff;border:none;border-radius:24px;font-weight:900">🚀 Upload करो</button>
  <div id="uploadProgress" style="margin-top:12px;display:none;background:#000;color:#fff;padding:12px;border-radius:10px;text-align:center">⏳ 0%</div>
</div>

<div class="info"><div class="title" id="mainTitle">BharatFlix - Aapka Apna Video Platform 🇮🇳</div><div class="meta"><div class="b-logo"><img src="logo.png?v=25"></div><div class="ch-name"><b>BharatFlix Official</b><br><span style="color:#606060;font-size:12px">1.2M • BharatFlix</span></div><div class="btns"><button class="sub" id="subBtn">Subscribe</button><button class="join" id="joinBtn">Join</button></div></div></div>
<div class="swipe" id="chipBar"><div>All</div><div>Comedy</div><div>Music</div><div>Bhakti</div><div>News</div></div>
<div class="feed" id="videoFeed"><div style="text-align:center;padding:20px;color:#888">⏳ लोड हो रहा है... 🇮🇳</div></div>

<div class="bottom">
<div class="btm-item active" id="homeBtn">🏠<span>Home</span></div>
<div class="btm-item" id="shortsBtn">🎬<span>Shorts</span></div>
<div class="btm-item" id="uploadBtn"><div class="upload">+</div><span>Upload</span></div>
<div class="btm-item" id="subsBtn">📺<span>Subs</span></div>
<div class="btm-item" id="profileBottomBtn"><div class="btm-profile" id="bottomProfilePic">👤</div><span>You</span></div>
</div>

<input type="file" id="fileInput" accept="video/*" style="display:none">
<input type="file" id="profilePicInput" accept="image/*" style="display:none">

<script>
const SUPA_URL = "https://dvaawuhwetwmmziucyow.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2YWF3dWh3ZXR3bW16aXVjeW93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MjM2NDcsImV4cCI6MjEwOTI5OTY0N30.2tqmnZbn_4_LKSet1JPKdTNKpzgy6y_i03V_AajCktI";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000);}
function addFeedUI(title, desc, category, url, isNew=false){
  let f=document.getElementById('videoFeed');
  if(f.innerHTML.includes('लोड हो रहा')) f.innerHTML="";
  let d=document.createElement('div');d.className='v-card';
  let safeDesc = desc ? desc.substring(0,70) : 'BharatFlix Video';
  let safeCat = category || 'Other';
  d.innerHTML = `<video src="${url}" muted preload="metadata"></video><div style="flex:1"><b style="font-size:13px;line-height:1.3">${title}</b><br><span style="font-size:12px;color:#606060;display:block;margin-top:4px">${safeDesc}</span><br><span style="font-size:11px;color:#138808;font-weight:700">📁 ${safeCat}</span></div>`;
  d.onclick=()=>{let v=document.getElementById('myVideo');v.src=url;v.play();document.getElementById('mainTitle').innerText=title;document.getElementById('playBtn').style.display='none';window.scrollTo(0,0);};
  if(isNew) f.prepend(d); else f.appendChild(d);
}
async function loadFromGodam(){
  try{
    const {data,error} = await supa.from('videos').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    if(!data || data.length==0){document.getElementById('videoFeed').innerHTML='<div style="text-align:center;padding:30px"><p style="font-size:40px">🇮🇳</p><b>स्वागत है!</b><br><button onclick="document.getElementById(\'uploadBtn\').click()" style="background:linear-gradient(90deg,#FF9933,#138808);color:#fff;border:none;padding:12px 24px;border-radius:24px;font-weight:900;margin-top:10px">+ पहली वीडियो डालो</button></div>';return;}
    document.getElementById('videoFeed').innerHTML=""; data.forEach(row=>{if(row.video_url) addFeedUI(row.title, row.description || '', row.category || '', row.video_url);});
  }catch(e){document.getElementById('videoFeed').innerHTML='<div style="text-align:center;padding:20px">Error: '+e.message+'</div>';}
}
loadFromGodam();

// SEARCH
const searchWrap=document.getElementById('searchWrap');
const searchPage=document.getElementById('searchPage');
const backSearch=document.getElementById('backSearch');
const searchPageInput=document.getElementById('searchPageInput');
const voicePop=document.getElementById('voicePop');
const micPageBtn=document.getElementById('micPageBtn');
searchWrap.onclick=()=>{searchPage.style.display='flex';setTimeout(()=>searchPageInput.focus(),100);};
backSearch.onclick=()=>searchPage.style.display='none';
searchPageInput.addEventListener('keypress',e=>{if(e.key==='Enter'){toast('🔍 '+e.target.value);searchPage.style.display='none';}});
micPageBtn.onclick=()=>{voicePop.style.display='flex';setTimeout(()=>voicePop.style.display='none',2000);};
voicePop.onclick=()=>voicePop.style.display='none';

const pop=document.getElementById('pop'),popContent=document.getElementById('popContent');
function showPop(h){popContent.innerHTML=h;pop.style.display='flex'}pop.onclick=e=>{if(e.target==pop)pop.style.display='none'}
let tempProfilePicData = null;

function openProfile(){
  const logged = localStorage.getItem('bharatflix_creator');
  let user = logged ? JSON.parse(logged) : null;
  if(user){
    let pic = user.profilePic ? `<img src="${user.profilePic}">` : '👤';
    showPop(`<div style="text-align:center"><div style="width:70px;height:70px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:#eee;overflow:hidden;border:2px solid #138808;font-size:30px">${pic}</div><b style="font-size:16px;margin-top:8px;display:block">${user.channel}</b><span style="font-size:12px;color:#666">${user.handle||''} • ${user.category||''}</span><br><span style="font-size:11px;color:#138808;font-weight:700">📍 ${user.district||''}, ${user.state||''}, ${user.country||''}</span></div><br><div style="display:flex;gap:8px"><button onclick="localStorage.removeItem('bharatflix_creator');location.reload();" style="flex:1;padding:12px;background:#000;color:#fff;border-radius:12px;border:none;font-weight:700">Logout</button><button onclick="pop.style.display='none'" style="flex:1;padding:12px;background:#eee;border-radius:12px;border:none;font-weight:700">Close</button></div>`);
  } else {
    showPop(`<b>👤 You</b><br><br><div onclick="openCreatorForm()" style="padding:14px;background:#FF0000;color:#fff;border-radius:12px;text-align:center;font-weight:900;cursor:pointer">🎬 Creator Account बनाओ</div><br><div onclick="openWorkerInAppForm()" style="padding:14px;background:#138808;color:#fff;border-radius:12px;text-align:center;font-weight:900;cursor:pointer">💼 Worker Join</div><br><button onclick="pop.style.display='none'" style="width:100%;padding:12px;background:#000;color:#fff;border-radius:12px;border:none">Close</button>`);
  }
}
function openCreatorForm(){
  tempProfilePicData = null;
  showPop(`<b style="font-size:18px">🎬 Channel बनाओ</b><br><br><div class="profile-upload-wrap"><div class="profile-preview" id="profilePreview">📷</div><div><b style="font-size:13px">Profile Photo *</b><br><button onclick="document.getElementById('profilePicInput').click()" style="margin-top:6px;padding:8px 14px;background:#000;color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700">📁 Photo चुनो</button></div></div><input id="c_channel" placeholder="Channel Name *" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px"><input id="c_handle" placeholder="Handle @AgraVlogs *" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px"><textarea id="c_desc" placeholder="Channel Description" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;height:60px"></textarea><select id="c_category" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px"><option>Comedy</option><option>Music</option><option>Bhakti</option><option>News</option><option>Education</option><option>Gaming</option><option>Vlog</option><option>Tech</option><option>Other</option></select><div style="display:flex;gap:8px;margin-bottom:10px"><select id="c_state" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:10px"><option value="">State *</option><option>Uttar Pradesh</option><option>Madhya Pradesh</option><option>Delhi</option><option>Rajasthan</option><option>Other</option></select><input id="c_district" placeholder="District *" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:10px"></div><select id="c_country" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px"><option value="India" selected>🇮🇳 India</option><option>USA</option><option>UK</option><option>Other</option></select><input id="c_email" placeholder="Email *" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px"><input id="c_mobile" placeholder="Mobile *" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px"><input id="c_pass" type="password" placeholder="Password *" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:14px"><button id="createChannelBtn" style="width:100%;padding:14px;background:#FF0000;color:#fff;border:none;border-radius:24px;font-weight:900">✅ Channel बनाओ</button>`);
  document.getElementById('profilePicInput').onchange = e => {
    let file = e.target.files[0]; if(!file) return;
    let reader = new FileReader();
    reader.onload = ev => { tempProfilePicData = ev.target.result; document.getElementById('profilePreview').innerHTML = `<img src="${tempProfilePicData}">`; };
    reader.readAsDataURL(file);
  };
  document.getElementById('createChannelBtn').onclick = async ()=>{
    let data = {channel: document.getElementById('c_channel').value.trim(), handle: document.getElementById('c_handle').value.trim(), desc: document.getElementById('c_desc').value.trim(), category: document.getElementById('c_category').value, state: document.getElementById('c_state').value, district: document.getElementById('c_district').value.trim(), country: document.getElementById('c_country').value, email: document.getElementById('c_email').value.trim(), mobile: document.getElementById('c_mobile').value.trim(), pass: document.getElementById('c_pass').value.trim(), profilePic: tempProfilePicData || ''};
    if(!data.channel || !data.handle || !data.state || !data.district || !data.email || !data.mobile){toast('❌ * वाले भरो');return;}
    if(!data.profilePic){toast('❌ Photo चुनो');return;}
    localStorage.setItem('bharatflix_creator', JSON.stringify(data));
    try{ await supa.from('creators').insert([{channel_name:data.channel, handle:data.handle, description:data.desc, category:data.category, state:data.state, district:data.district, country:data.country, email:data.email, mobile:data.mobile, profile_pic:data.profilePic}]); }catch(e){}
    pop.style.display='none'; document.getElementById('bottomProfilePic').innerHTML = `<img src="${data.profilePic}">`; toast('✅ Channel बन गया 🇮🇳');
  };
}
function openWorkerInAppForm(){
  showPop(`<b>💼 Worker Join</b><br><br><input id="w_name" placeholder="आपका नाम" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:10px"><input id="w_skill" placeholder="काम" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:10px"><input id="w_mobile" placeholder="Mobile" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:14px"><button id="workerSubmitBtn" style="width:100%;padding:14px;background:#138808;color:#fff;border:none;border-radius:24px;font-weight:900">✅ Join करो</button><br><br><button onclick="openProfile()" style="width:100%;padding:10px;background:#eee;border-radius:12px;border:none">Back</button>`);
  document.getElementById('workerSubmitBtn').onclick = async ()=>{
    let n=document.getElementById('w_name').value; let s=document.getElementById('w_skill').value; let m=document.getElementById('w_mobile').value;
    if(!n||!s||!m){toast('❌ सब भरो');return;}
    try{ await supa.from('workers').insert([{name:n, skill:s, mobile:m}]); }catch(e){}
    pop.style.display='none'; toast('✅ Worker Join 🇮🇳');
  };
}
function openJoin(){
  showPop(`<b>💎 Join BharatFlix</b><br><br><div style="border:1px solid #FF9933;border-radius:12px;padding:12px;margin-bottom:10px"><b>₹59 / Month</b><br><button onclick="toast('💎 ₹59');pop.style.display='none'" style="margin-top:8px;width:100%;padding:10px;background:#FF9933;color:#fff;border:none;border-radius:20px;font-weight:900">Join ₹59</button></div><div style="border:1px solid #138808;border-radius:12px;padding:12px"><b>₹299 / Year</b><br><button onclick="toast('💎 ₹299');pop.style.display='none'" style="margin-top:8px;width:100%;padding:10px;background:#138808;color:#fff;border:none;border-radius:20px;font-weight:900">Join ₹299</button></div><br><button onclick="pop.style.display='none'" style="width:100%;padding:10px;background:#eee;border-radius:12px;border:none">Close</button>`);
}

// UPLOAD - SADA
let selectedFile = null;
document.getElementById('uploadBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
  selectedFile = e.target.files[0];
  if(!selectedFile) return;
  document.getElementById('uploadDetails').style.display='flex';
  document.getElementById('v_title').value = selectedFile.name.replace('.mp4','');
};
document.getElementById('closeUploadDetails').onclick=()=>document.getElementById('uploadDetails').style.display='none';
document.getElementById('finalUploadBtn').onclick = async ()=>{
  if(!selectedFile) return;
  let title = document.getElementById('v_title').value.trim();
  let desc = document.getElementById('v_desc').value.trim();
  let cat = document.getElementById('v_category').value;
  if(!title||!desc){toast('Title + Description लिखो');return;}
  let prog = document.getElementById('uploadProgress');
  prog.style.display='block'; prog.innerText='⏳ 50% गोदाम में...';
  try{
    const name = Date.now()+'_'+selectedFile.name.replace(/[^a-zA-Z0-9.]/g,'_');
    const {error:upErr} = await supa.storage.from('videos').upload(name, selectedFile);
    if(upErr) throw upErr;
    prog.innerText='⏳ 80% लिंक...';
    const {data:urlData} = supa.storage.from('videos').getPublicUrl(name);
    await supa.from('videos').insert([{title:title, description:desc, category:cat, video_url:urlData.publicUrl}]);
    prog.innerText='✅ हो गया!'; 
    setTimeout(()=>{document.getElementById('uploadDetails').style.display='none';prog.style.display='none';},800);
    addFeedUI(title, desc, cat, urlData.publicUrl, true);
    document.getElementById('myVideo').src=urlData.publicUrl; document.getElementById('myVideo').play();
    toast('✅ Upload 🇮🇳');
  }catch(err){prog.innerText='❌ '+err.message}
};

// YOUTUBE JAISA PLAYER - NO CUT + FULLSCREEN LANDSCAPE
const myVideo = document.getElementById('myVideo');
const playBtn = document.getElementById('playBtn');
const rotateHint = document.getElementById('rotateHint');
playBtn.onclick=()=>{myVideo.play();playBtn.style.display='none'};
myVideo.onpause=()=>playBtn.style.display='flex';
myVideo.onplay=()=>playBtn.style.display='none';
myVideo.addEventListener('fullscreenchange',()=>{
  if(document.fullscreenElement){
    if(window.innerHeight > window.innerWidth){
      rotateHint.style.display='block';
      setTimeout(()=>rotateHint.style.display='none',2500);
      if(screen.orientation && screen.orientation.lock){screen.orientation.lock('landscape').catch(()=>{});}
    }
  } else {
    if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    rotateHint.style.display='none';
  }
});

// BOTTOM BUTTONS
document.getElementById('homeBtn').onclick=()=>{document.querySelectorAll('.btm-item').forEach(b=>b.classList.remove('active'));document.getElementById('homeBtn').classList.add('active');window.scrollTo({top:0,behavior:'smooth'});};
document.getElementById('shortsBtn').onclick=()=>{document.querySelectorAll('.btm-item').forEach(b=>b.classList.remove('active'));document.getElementById('shortsBtn').classList.add('active');toast('🎬 Shorts जल्दी आएगा');};
document.getElementById('subsBtn').onclick=()=>{document.querySelectorAll('.btm-item').forEach(b=>b.classList.remove('active'));document.getElementById('subsBtn').classList.add('active');toast('📺 Subs');};
document.getElementById('profileBottomBtn').onclick=()=>{document.querySelectorAll('.btm-item').forEach(b=>b.classList.remove('active'));document.getElementById('profileBottomBtn').classList.add('active');openProfile();};
document.getElementById('bellBtn').onclick=()=>toast('🔔 ON');
document.getElementById('setBtn').onclick=()=>showPop('<div style="padding:14px;background:#f2f2f2;border-radius:12px">🇮🇳 BharatFlix v25<br>✅ YouTube Player - No Cut<br>✅ Contain Mode</div><br><button onclick="pop.style.display=\'none\'" style="width:100%;padding:12px;background:#000;color:#fff;border-radius:12px;border:none">Close</button>');
document.getElementById('joinBtn').onclick=openJoin;
document.getElementById('subBtn').onclick=function(){this.innerText=this.innerText=='Subscribe'?'Subscribed ✅':'Subscribe';toast('✅ '+this.innerText)};

(function(){let logged=localStorage.getItem('bharatflix_creator');if(logged){try{let u=JSON.parse(logged);if(u.profilePic) document.getElementById('bottomProfilePic').innerHTML=`<img src="${u.profilePic}">`;}catch(e){}}})();

let deferredPrompt=null;
let isInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
function updateInstallBtn(){let btn=document.getElementById('installBtn');if(isInstalled){btn.innerText='💙 Installed';btn.className='install';}else{btn.innerText='📲 Install';btn.className='install green';}}
updateInstallBtn();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!isInstalled){let b=document.getElementById('installBtn');b.innerText='📲 Install';b.className='install green';}});
document.getElementById('installBtn').onclick=async()=>{
  let btn=document.getElementById('installBtn');
  if(isInstalled){toast('✅ Home Screen पर है 🇮🇳');return;}
  if(deferredPrompt){
    btn.innerText='⏳ Installing...';
    deferredPrompt.prompt();
    const {outcome}=await deferredPrompt.userChoice;
    if(outcome==='accepted'){setTimeout(()=>{btn.innerText='💙 Installed';btn.className='install';toast('✅ Home Screen पर आ गया 🇮🇳');},1000);}
    else{btn.innerText='📲 Install';btn.className='install green';}
    deferredPrompt=null;
  }else{toast('ऊपर ⋮ > Add to Home Screen दबाओ');}
};
</script>
