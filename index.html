<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix - Final All in One</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#fff;padding-top:62px;padding-bottom:75px}
.header{position:fixed;top:0;left:0;right:0;z-index:9999;background:#fff;height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;box-shadow:0 2px 8px #0002;border-radius:0 0 16px 16px}
.logo{font-size:28px;font-weight:900}.logo b:first-child{color:#ff6a00}.logo b:last-child{color:#138808}
.h-icons{display:flex;gap:14px;font-size:20px;align-items:center}
.avatar{width:30px;height:30px;background:#3b82f6;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.player-wrap{width:100%;background:#000;aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center}
.play-btn{width:75px;height:75px;background:red;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:35px;cursor:pointer;z-index:2}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000);color:#fff;font-size:11px;padding:10px}
.info{padding:10px 12px}.title{font-size:16px;font-weight:700}.sub{font-size:13px;color:#606060;margin-top:4px}
.action-row{display:flex;gap:8px;overflow-x:auto;padding:12px 0;white-space:nowrap;scrollbar-width:none}.action-row::-webkit-scrollbar{display:none}
.act-btn{background:#f2f2f2;border:none;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0}
.act-btn.active{background:#000;color:#fff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:9999;text-align:center}
.bottom-nav div{font-size:11px;cursor:pointer}.bottom-nav b{font-size:22px;display:block}
#uploadModal,#payModal{display:none;position:fixed;inset:0;background:#000a;z-index:10000;align-items:center;justify-content:center}
.modal{background:#fff;width:92%;max-width:380px;padding:18px;border-radius:16px}
.modal input,.modal button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
.modal button{background:red;color:#fff;border:none;font-weight:bold}
</style>
</head>
<body>

<div class="header">
<div class="logo"><b>Bharat</b><b>Flix</b></div>
<div class="h-icons"><span>🔍</span><span>🔔</span><span>⚙️</span><div class="avatar">B</div></div>
</div>

<div class="player-wrap" id="playerWrap">
<div class="play-btn" onclick="playFirst()">▶</div>
<div class="bottom-bar">0:42 / 5:18 • LIVE • 1.2M views • Lib: 760230</div>
</div>

<div class="info">
<h3 class="title" id="vTitle">Independence Day Special | Rise of United India</h3>
<p class="sub">BharatFlix • 2.8M subscribers • 1.2M views</p>

<!-- 12 BUTTON + THANKS + JOIN -->
<div class="action-row">
  <button class="act-btn" id="likeBtn" onclick="doLike()">👍 <span id="likeCount">2.8K</span></button>
  <button class="act-btn" onclick="doDislike()">👎</button>
  <button class="act-btn" onclick="shareCurrent()">📤 Share</button>
  <button class="act-btn" onclick="doRemix()">🔗 Remix</button>
  <button class="act-btn" style="background:#138808;color:#fff" onclick="downloadCurrent()">⬇️ Download</button>
  <button class="act-btn" onclick="openJoin()" style="border:1px solid #3b82f6;color:#3b82f6">🔵 Join</button>
  <button class="act-btn" onclick="openThanks()">🙏 Thanks</button>
  <button class="act-btn" onclick="doClip()">✂️ Clip</button>
  <button class="act-btn" onclick="saveVideo()">🔖 Save</button>
  <button class="act-btn" onclick="doReport()">🚩 Report</button>
  <button class="act-btn" onclick="showComment()">💬 1.2K</button>
  <button class="act-btn">⋯ More</button>
</div>

<div id="videoList"></div>
</div>

<!-- BOTTOM - SIRF YAHI 1 UPLOAD RAHEGA - YOUTUBE JAISA -->
<div class="bottom-nav">
<div onclick="location.reload()"><b>🏠</b>Home</div>
<div><b>◐</b>Shorts</div>
<div onclick="openUpload()"><b style="background:#000;color:#fff;width:44px;height:28px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:auto">+</b>Upload</div>
<div><b>📺</b>Subs</div>
<div><b>👤</b>Profile</div>
</div>

<!-- UPLOAD MODAL -->
<div id="uploadModal"><div class="modal">
<h3>Upload - BharatFlix</h3>
<input id="vName" placeholder="Video ka naam likho">
<input type="file" id="vFile" accept="video/*">
<button onclick="doUpload()">Upload Karo - Direct Cloud</button>
<button style="background:#eee;color:#000" onclick="closeUpload()">Band Karo</button>
<p id="msg" style="font-size:12px;margin-top:6px"></p>
</div></div>

<!-- THANKS / JOIN MODAL -->
<div id="payModal"><div class="modal" style="text-align:center">
<h3 id="payTitle">🙏 Thanks</h3>
<p id="paySub" style="font-size:13px;color:#666">BharatFlix ko Support karo</p>
<div id="payOptions" style="display:grid;gap:10px;margin-top:12px"></div>
<button style="background:#eee;color:#000" onclick="closePay()">Band Karo</button>
</div></div>

<script>
const CLOUD="xuwsza3g"; const PRESET="bharatflix";
const MY_UPI="bharatflix@upi"; // <-- भैया जी यहाँ अपना PhonePe/GPay UPI डाल दो, पैसा सीधा आएगा
let videos=JSON.parse(localStorage.getItem('bf_final')||'[]'); let currentUrl=""; let liked=false;

function openUpload(){document.getElementById('uploadModal').style.display='flex'}
function closeUpload(){document.getElementById('uploadModal').style.display='none'}
function closePay(){document.getElementById('payModal').style.display='none'}

async function doUpload(){
 const file=document.getElementById('vFile').files[0]; const title=document.getElementById('vName').value||"BharatFlix Video";
 if(!file) return alert("Video chun lo bhaiya ji");
 document.getElementById('msg').innerText="Upload ho raha hai bhaiya ji...";
 const fd=new FormData(); fd.append('file',file); fd.append('upload_preset',PRESET);
 try{
  let r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/video/upload`,{method:'POST',body:fd}); let d=await r.json();
  if(!d.secure_url){ fd.set('upload_preset','ml_default'); r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/video/upload`,{method:'POST',body:fd}); d=await r.json(); }
  if(d.secure_url){ currentUrl=d.secure_url; videos.unshift({title,url:d.secure_url}); localStorage.setItem('bf_final',JSON.stringify(videos)); document.getElementById('msg').innerText="Ho gaya ✅"; render(); autoDownload(d.secure_url,title); setTimeout(closeUpload,1000); }
  else { document.getElementById('msg').innerText="Error: "+(d.error?.message||'preset check karo'); }
 }catch(e){document.getElementById('msg').innerText="Network error"}
}
function render(){document.getElementById('videoList').innerHTML=videos.map(v=>`<div onclick="playVideo('${v.url}','${v.title.replace(/'/g,'')}')" style="display:flex;gap:10px;margin:12px 0;cursor:pointer"><div style="width:140px;height:80px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px">▶</div><div><b style="font-size:13px">${v.title}</b><br><small style="color:#666">Click to play</small></div></div>`).join('');}
function playVideo(url,title){currentUrl=url; document.getElementById('playerWrap').innerHTML=`<video src="${url}" controls autoplay style="width:100%;height:100%"></video><div class="bottom-bar">${title}</div>`; document.getElementById('vTitle').innerText=title; window.scrollTo(0,0);}
function playFirst(){if(videos[0]) playVideo(videos[0].url,videos[0].title);}
function autoDownload(url,name){const a=document.createElement('a'); a.href=url; a.download=(name||'video')+'.mp4'; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();}
function downloadCurrent(){if(!currentUrl) return alert("Pehle video play karo bhaiya ji"); autoDownload(currentUrl, document.getElementById('vTitle').innerText);}
function shareCurrent(){if(currentUrl){ if(navigator.share) navigator.share({title:'BharatFlix', url:currentUrl}); else prompt("Link copy karo:", currentUrl);}}
function doLike(){ liked=!liked; document.getElementById('likeBtn').classList.toggle('active'); document.getElementById('likeCount').innerText= liked?"2.9K":"2.8K"; }
function doDislike(){ alert("Dislike ho gaya bhaiya ji"); }
function doRemix(){ alert("Remix - Shorts banega isse"); }
function doClip(){ alert("Clip bana rahe hain 5 sec ka"); }
function saveVideo(){ alert("Save ho gaya Library me bhaiya ji"); }
function doReport(){ alert("Report bhej diya"); }
function showComment(){ alert("Comments: Jai Hind 🇮🇳 Bahut badhiya video"); }

// THANKS / JOIN - KAMAI WALA
function openThanks(){
 document.getElementById('payModal').style.display='flex';
 document.getElementById('payTitle').innerText='🙏 Thanks';
 document.getElementById('paySub').innerText='Support karo - Patna se bhi chalega';
 document.getElementById('payOptions').innerHTML=`
  <button onclick="payNow(20)" style="padding:12px;border-radius:10px;border:1px solid #ddd;background:#fff">₹20 💛</button>
  <button onclick="payNow(50)" style="padding:12px;border-radius:10px;border:1px solid #ddd;background:#fff">₹50 🧡</button>
  <button onclick="payNow(100)" style="padding:12px;border-radius:10px;border:1px solid #ff6a00;background:#fff3e0;font-weight:bold">₹100 🔥 Best</button>
  <button onclick="payNow(500)" style="padding:12px;border-radius:10px;border:1px solid #ddd;background:#fff">₹500 💎 VIP</button>`;
}
function openJoin(){
 document.getElementById('payModal').style.display='flex';
 document.getElementById('payTitle').innerText='🔵 Join Membership';
 document.getElementById('paySub').innerText='Monthly Support - YouTube jaisa';
 document.getElementById('payOptions').innerHTML=`
  <div onclick="payNow(29,'JOIN-FAN')" style="border:1px solid #ddd;border-radius:12px;padding:12px;text-align:left;cursor:pointer"><b>₹29 / महीना - Fan</b><br><small>Badge + Emoji</small></div>
  <div onclick="payNow(59,'JOIN-PRO')" style="border:1px solid #138808;border-radius:12px;padding:12px;text-align:left;background:#f0fff0;cursor:pointer"><b>₹59 / महीना - Pro ⭐</b><br><small>Early Videos</small></div>
  <div onclick="payNow(119,'JOIN-VIP')" style="border:1px solid #ff6a00;border-radius:12px;padding:12px;text-align:left;cursor:pointer"><b>₹119 / महीना - VIP 👑</b><br><small>Naam video me</small></div>`;
}
function payNow(amount, plan){
 const upiLink = `upi://pay?pa=${MY_UPI}&pn=BharatFlix&am=${amount}&cu=INR&tn=${plan||'Thanks'}`;
 window.location.href = upiLink;
 setTimeout(()=>{ alert(`UPI App nahi khula to is ID par bhejo bhaiya ji: ${MY_UPI} - ₹${amount}`); }, 1200);
}
render();
</script>
</body>
</html>
