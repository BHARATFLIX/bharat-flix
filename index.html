<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat Flix - Official Active Portal 🇮🇳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.header{position:sticky;top:0;background:#111;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:100;border-bottom:2px solid #FF9933}
.logo{font-weight:900;font-size:20px;color:#FF9933}
.logo span{color:#fff}
.live-btn{background:red;color:#fff;padding:8px 14px;border:none;border-radius:20px;font-weight:800;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
#side{position:fixed;top:56px;left:0;width:80%;max-width:320px;height:calc(100% - 56px);background:#141414;z-index:90;overflow-y:auto;padding:12px;border-right:1px solid #333;transform:translateX(0)}
.video-card{background:#222;margin-bottom:10px;border-radius:10px;overflow:hidden;cursor:pointer}
.video-card img{width:100%;height:140px;object-fit:cover}
.video-card.info{padding:8px;font-size:13px}
.main{margin-left:320px;padding:16px}
@media(max-width:768px){.main{margin-left:0} #side{width:100%}}
#player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:2px solid #222}
#player iframe{width:100%;height:100%;border:none}
.donate{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.donate button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="header">
<div class="logo">BHARAT <span>FLIX</span> 🇮🇳</div>
<button class="live-btn" onclick="goLive()">🔴 GO LIVE</button>
</div>

<!-- ONTF SIDEBAR - सीधा खुला रहेगा -->
<div id="side">
<h3 style="color:#FF9933;margin-bottom:12px">☰ ONTF - Videos</h3>
<div id="list"></div>
<div style="margin-top:16px;padding:10px;background:#000;border-radius:8px;font-size:11px;color:#888;text-align:center">
✅ Bunny Secured<br>✅ Official Active Portal
</div>
</div>

<div class="main">
<div id="player"><iframe id="vFrame" allowfullscreen></iframe></div>
<h2 id="vTitle" style="margin:12px 0">Bharat Flix - Video Select करो</h2>

<div class="donate">
<button style="background:#FF9933;color:#000" onclick="donate(10)">💰 ₹10 Support</button>
<button style="background:#fff;color:#000" onclick="donate(50)">💰 ₹50 Support</button>
<button style="background:#138808;color:#fff" onclick="donate(100)">💰 ₹100 Support</button>
</div>
</div>

<script>
// CONFIG - Bunny Keys Secure
const BUNNY_LIB = atob('MjQ1Nzg0'); // Your Library ID
const BUNNY_CDN = 'https://vz-0d1b8f6d-5b1.b-cdn.net';

let vids=[
{name:"Bharat Flix Intro", url:BUNNY_CDN+"/245784/0.mp4"},
{name:"ONTF Video 1", url:BUNNY_CDN+"/245784/1.mp4"},
{name:"ONTF Video 2", url:BUNNY_CDN+"/245784/2.mp4"},
{name:"ONTF Video 3", url:BUNNY_CDN+"/245784/3.mp4"}
];

function render(){
 let h='';
 vids.forEach((v,i)=>{
   h+=`<div class="video-card" onclick="playVideo('${v.url}','${v.name}')">
   <img src="https://via.placeholder.com/320x180/FF9933/000000?text=${encodeURIComponent(v.name)}">
   <div class="info">▶️ ${v.name}</div>
   </div>`;
 });
 document.getElementById('list').innerHTML=h;
}

function playVideo(url,title){
 document.getElementById('vFrame').src=url;
 document.getElementById('vTitle').innerText=title;
}

function goLive(){
 alert('🔴 Go Live चालू हो गया भैया जी! Camera On करो');
}

function donate(amt){
 window.open(`upi://pay?pa=YOURUPI@upi&pn=BharatFlix&am=${amt}&cu=INR`,'_blank');
}

render();
playVideo(vids[0].url, vids[0].name);
</script>
</body>
</html>
