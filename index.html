<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat Flix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(to bottom,#FF9933 0%,#FF8A00 35%,#ffffff 35%,#ffffff 65%,#138808 65%,#0d8a3a 100%);display:flex;justify-content:center;align-items:center;padding:16px}
.card{background:#fff;width:100%;max-width:380px;border-radius:30px;border:5px solid #FFC107;box-shadow:0 15px 40px rgba(0,0,0,.35);padding:28px 18px 20px 18px;text-align:center;margin-top:60px;position:relative}
.logo{position:absolute;top:-62px;left:50%;transform:translateX(-50%);width:118px;height:118px;border-radius:26px;background:linear-gradient(to bottom,#FF9933 0%,#ffe1b0 30%,#fff 50%,#b8e6c0 75%,#138808 100%);border:4px solid #FFC107;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(0,0,0,.4)}
.logo b{font-size:74px;color:#D4A017;font-weight:900;text-shadow:0 2px 0 #fff,0 3px 8px rgba(0,0,0,.3)}
.title{margin-top:64px;font-size:35px;font-weight:900;color:#FFB700;letter-spacing:1px;text-shadow:0 1px 0 #8a5e00}
.sub{color:#0e8a3e;font-weight:800;font-size:19px;margin:8px 0 18px 0}
.welcome{color:#B91C1C;font-weight:800;font-size:23px;line-height:1.32}
.msg{margin:20px 0;background:#FFF7E0;border:3px solid #ffbe3d;border-left:6px solid #FF8A00;border-right:6px solid #138808;border-radius:18px;padding:14px 12px;font-weight:700;font-size:18px;line-height:1.4;color:#111;box-shadow:inset 0 0 0 1px #ffe9b0}
.btn{width:100%;border:none;background:linear-gradient(90deg,#FF8C00 0%,#FFA500 45%,#FFCC00 100%);border-radius:50px;padding:19px 12px;font-size:21px;font-weight:900;color:#000;cursor:pointer;box-shadow:0 8px 20px rgba(255,140,0,.45);display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:scale(0.97)}
.footer{margin-top:16px;font-size:11.5px;color:#444;font-weight:600;line-height:1.3}

/* भैया जी आपका गोल्डन + हिलने वाला सेंसर */
.touch-gold{color:#8a5e00;background:linear-gradient(90deg,#FFB700,#FFD700);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #fff);font-weight:900;animation:hilao 1.2s infinite}
@keyframes hilao{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.btn.play-mode{background:linear-gradient(90deg,#138808,#2ecc71);color:#fff;box-shadow:0 8px 20px rgba(19,136,8,.45)}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><b>B</b></div>
  <div class="title">BHARAT FLIX</div>
  <div class="sub">🇮🇳 भारत का अपना OTT 🇮🇳</div>
  <div class="welcome">भारत फ्लिक्स में आपका स्वागत है!<br>हमेशा जुड़े रहिए भारत फ्लिक्स से,<br>ये आपका अपना प्लेटफॉर्म है।</div>
  <div class="msg">🙏 ये आपका खुद का प्लेटफॉर्म है,<br>यहाँ सब अपने हैं। ये बहुत बड़ा<br>परिवार होने वाला है!</div>
  <button class="btn" id="mainBtn" onclick="installNow()">📱 अभी इंस्टॉल करें - <span class="touch-gold">यहाँ टच करें</span></button>
  <div class="footer" id="footText">✅ सिर्फ 15MB | 100% सुरक्षित | Made in Bharat<br>टच करते ही डाउनलोड शुरू होगा</div>
</div>
<script>
const FILE_ID="134vw8oxdPhHCqcwgEu0gjW7sID9AqmZ1";
const DOWNLOAD_URL="https://drive.google.com/uc?export=download&id="+FILE_ID;

// भैया जी सेंसर चेक - अगर पहले PLAY दबा चुका है तो INSTALL दिखेगा ही नहीं
if(localStorage.getItem('bharat_final_lock') === 'band_kar_do'){
  window.location.href="home.html";
}

function installNow(){
  const btn = document.getElementById('mainBtn');
  const foot = document.getElementById('footText');
  
  // 1. डाउनलोड शुरू
  window.location.href=DOWNLOAD_URL;
  
  // 2. Installing दिखाओ
  let p=0;
  btn.disabled=true;
  btn.innerHTML="⏳ Installing... 0%";
  foot.innerHTML="डाउनलोड हो रहा है भैया जी, रुकिए...";
  
  let timer=setInterval(()=>{
    p+=12;
    if(p>100) p=100;
    btn.innerHTML="⏳ Installing... "+p+"%";
    if(p>=100){
      clearInterval(timer);
      // 3. PLAY बटन बना दो - सेंसर यहीं लगेगा भैया जी
      btn.disabled=false;
      btn.innerHTML="▶️ PLAY - अब खोलें";
      btn.className="btn play-mode";
      foot.innerHTML="✅ डाउनलोड पूरा! अब PLAY दबाएँ";
      btn.onclick=playSensor; // अब PLAY में सेंसर आ गया
    }
  },300);
}

// भैया जी यही है आपका फाइनल PLAY वाला सेंसर - सिर्फ यहीं लगेगा!
function playSensor(){
  localStorage.setItem('bharat_final_lock','band_kar_do'); // ताला बंद!
  window.location.href="home.html"; // सीधा HOME
}
</script>
</body>
</html>
