<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix - YouTube Final Look</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Roboto,Arial}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:#0f0f0f;z-index:10}
.logo{font-weight:700;font-size:18px}.logo span{background:red;padding:2px 6px;border-radius:4px;margin-left:4px}
.right{display:flex;gap:14px;align-items:center}.b{width:32px;height:32px;background:#ff6a00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.video{width:100%;aspect-ratio:16/9;background:#000} video{width:100%;height:100%}
.info{padding:12px 16px}.title{font-size:18px;font-weight:700;line-height:1.3}
.meta{color:#aaa;font-size:14px;margin-top:6px;display:flex;gap:12px;align-items:center}
.sub-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.channel{display:flex;gap:10px;align-items:center}.sub-btn{background:#fff;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:700}
.actions{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.a-btn{background:#272727;border:none;color:#fff;padding:8px 14px;border-radius:20px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.final{padding:16px;display:flex;flex-direction:column;gap:10px}
.btn{padding:15px;border-radius:28px;text-align:center;text-decoration:none;font-weight:700;font-size:16px}
.red{background:red;color:#fff}.black{background:#272727;color:#fff;border:1px solid #444}.green{background:#0f9d58;color:#fff}
.nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#0f0f0f;padding:10px 0;border-top:1px solid #222;font-size:12px;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="logo">BharatFlix<span>Flix</span></div>
  <div class="right">🔍 🔔 <div class="b">B</div> <a href="account.html" style="text-decoration:none">⚙️</a></div>
</div>

<div class="video"><video id="v" controls poster="icon.png"></video></div>

<div class="info">
  <div class="title">BharatFlix पर आपका स्वागत है! YouTube जैसा Final Look 🔥</div>
  <div class="meta"><span>1.2M views • 2 days ago</span><span>• #BharatFlix</span></div>
  <div class="sub-row">
    <div class="channel"><div class="b">B</div><div><div style="font-weight:700">BharatFlix Official</div><div style="font-size:12px;color:#aaa">1.5M subscribers</div></div></div>
    <button class="sub-btn">Subscribe</button>
  </div>
</div>

<div class="actions">
  <button class="a-btn">👍 24K | 👎</button>
  <button class="a-btn">🔗 Share</button>
  <button class="a-btn">⬇️ Download</button>
  <button class="a-btn">🔖 Save</button>
  <button class="a-btn">🎬 Remix</button>
</div>

<div class="final">
  <label for="fileInput" class="btn red">⬇️ Video Upload Karo</label>
  <input type="file" id="fileInput" hidden accept="video/*">
  <a class="btn black" href="https://docs.google.com/forms/d/e/1FAIpQLSemVqI495aFqQ-jpURcTDtR4oxHfIJ4Nn9Sn1_XMG1JhElseQ/viewform?usp=sharing&ouid=111213312838653848647">📝 अपना Channel बनाओ</a>
  <a class="btn green" href="https://docs.google.com/spreadsheets/d/1-U4mJuNcVZ2IkoftStyc6OGplT24n1Eq4nz6zlwGxfw/edit?usp=drivesdk">💺 Seat List देखो</a>
  <p id="status" style="text-align:center;color:#0f9d58;font-size:13px">Safe System ON ✅ - Upload karke dekho</p>
</div>

<div style="padding:0 16px 80px 16px"><a href="niyam.html" style="color:#3ea6ff;text-decoration:none;font-size:14px">📜 BharatFlix के नियम देखें</a></div>

<div class="nav"><div>🏠<br>Home</div><div>▶️<br>Shorts</div><div>➕</div><div>📺<br>Subs</div><div>👤<br>You</div></div>

<!-- YEH 2 LINE IMPORTANT HAI BHAYA JI - ISSE HI CHALEGA -->
<script type="module">
  import { checkVideoSafety } from './src/sensor.js';
  const fileInput = document.getElementById('fileInput');
  const video = document.getElementById('v');
  const status = document.getElementById('status');
  fileInput.addEventListener('change', async (e) => {
    let file = e.target.files[0];
    if(!file) return;
    status.innerText = "Guard Check ho raha hai...";
    let safe = await checkVideoSafety(file);
    if(safe){
      status.innerText = "Safe hai ✅ Video chal rahi hai";
      video.src = URL.createObjectURL(file);
      video.play();
    } else {
      status.innerText = "❌ Ye video allowed nahi hai";
      alert("Bhaiya ji ye video safe nahi hai!");
    }
  });
</script>

</body>
</html>
