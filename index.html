<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHARAT FLIX</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.header{padding:12px;background:#111;display:flex;align-items:center;gap:10px}
.logo{color:gold;font-weight:bold;font-size:18px;display:flex;align-items:center;gap:8px}
.logo img{width:45px;height:45px;border-radius:10px;border:2px solid gold;background:#fff;object-fit:cover}
.top-btns{text-align:center;padding:10px}
.top-btns a{display:inline-block;padding:12px 18px;border-radius:25px;text-decoration:none;font-weight:bold;margin:6px}
.white-btn{background:#fff;color:#000}
.blue-btn{background:#0066ff;color:#fff}
.earn{background:#111;border:1px solid gold;margin:10px;padding:12px;border-radius:10px;text-align:center}
.search{width:90%;margin:10px 5%;padding:12px;border-radius:25px;border:none;background:#222;color:#fff}
.card{background:#1a1a1a;margin:12px;border-radius:12px;overflow:hidden}
.video-box{width:100%;aspect-ratio:16/9;background:#000}
.video-box iframe{width:100%;height:100%;border:none}
.info{padding:12px}
.channel{display:flex;align-items:center;gap:10px;margin:10px 0}
.channel img{width:36px;height:36px;border-radius:50%;border:1px solid gold}
.sub-btn{background:red;color:#fff;border:none;padding:6px 16px;border-radius:20px;font-weight:bold;margin-left:auto}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stats button{background:#2a2a2a;color:#fff;border:none;padding:8px 14px;border-radius:20px}
.comment-box{margin-top:10px;background:#111;padding:10px;border-radius:10px}
.comment-box input{width:95%;padding:10px;border-radius:20px;border:none;background:#222;color:#fff}
</style>
</head>
<body>
<div class="header">
<div class="logo">
<img src="IMG-20260915-WA0000.jpg" alt="B">
BHARAT FLIX
</div>
</div>
<div class="top-btns">
<a href="#" class="white-btn">⬇ Download App</a>
<a href="#" class="blue-btn">📤 Share & Earn 50%</a>
</div>
<div class="earn"><b>💰 50% कमाओ:</b> हर शेयर पर कमाई!</div>
<input class="search" placeholder="Search movies...">
<div id="videos"></div>
<script>
const videos=[
{title:"BHARAT FLIX Trailer", id:"dQw4w9WgXcQ", views:"1.2M"},
{title:"New Action Movie 2026", id:"jNQXAC9IVRw", views:"856K"},
{title:"Comedy Web Series", id:"9bZkp7q19f0", views:"2.1M"}
];
let likes={};
function load(){
let h="";
videos.forEach((v,i)=>{
if(!likes[i])likes[i]={like:1250,dislike:12,sub:false,liked:false};
h+=`<div class="card"><div class="video-box"><iframe src="https://www.youtube.com/embed/${v.id}" allowfullscreen></iframe></div><div class="info"><b>${v.title}</b><div class="channel"><img src="IMG-20260915-WA0000.jpg"><span>BHARAT FLIX</span><button class="sub-btn" id="sub${i}" onclick="subscribe(${i})">${likes[i].sub?'Subscribed ✓':'Subscribe'}</button></div><div class="stats"><button onclick="like(${i})">👍 <span id="like${i}">${likes[i].like}</span></button><button onclick="dislike(${i})">👎 <span id="dislike${i}">${likes[i].dislike}</span></button><button>👁️ ${v.views}</button><button>🔗 Share</button></div><div class="comment-box"><input placeholder="Add a comment..." onkeypress="if(event.key==='Enter')addComment(this,${i})"><div id="comments${i}"><div>👤 User: Super app! 🔥</div></div></div></div></div>`;
});
document.getElementById('videos').innerHTML=h;
}
function like(i){if(!likes[i].liked){likes[i].like++;likes[i].liked=true;}else{likes[i].like--;likes[i].liked=false;}document.getElementById('like'+i).innerText=likes[i].like;}
function dislike(i){likes[i].dislike++;document.getElementById('dislike'+i).innerText=likes[i].dislike;}
function subscribe(i){likes[i].sub=!likes[i].sub;document.getElementById('sub'+i).innerText=likes[i].sub?'Subscribed ✓':'Subscribe';}
function addComment(el,i){if(el.value.trim()!=""){let d=document.createElement('div');d.innerText='👤 You: '+el.value;document.getElementById('comments'+i).prepend(d);el.value='';}}
load();
</script>
</body>
</html>
