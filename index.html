async function loadFromGodam(){
  try{
    if(!supa){ clearTimeout(hardTimeout); showError('Supabase init fail'); return; }
    let {data, error} = await supa.from('videos').select('*').order('created_at',{ascending:false}).limit(20);

    if(!data || data.length==0){ showEmpty(); return; }

    clearTimeout(hardTimeout);

  }
