<!DOCTYPE html>
<html lang="hi" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>BharatFlix</title>
<link rel="icon" href="https://raw.githubusercontent.com/BHARATFLIX/bharat-flix/main/apk-icon.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/BHARATFLIX/bharat-flix/main/apk-icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff;padding-bottom:80px}
.top{display:flex;align-items:center;gap:8px;padding:8px;position:sticky;top:0;background:#fff;z-index:100}
.top img.logoImg{width:42px;height:42px;min-width:42px;border-radius:50%;object-fit:cover}
.brand3d{font-size:18px;font-weight:900;line-height:1.05;white-space:nowrap;color:#FF9933;text-shadow:1px 1px 0 #138808,2px 2px 0 rgba(19,136,8,.5)}
.brand3d span{color:#138808;text-shadow:1px 1px 0 #FF9933,2px 2px 0 rgba(255,153,51,.5)}
.searchIconBtn{width:36px;height:36px;min-width:36px;border:none;background:#eee;border-radius:50%;font-size:17px;cursor:pointer}
.searchExpand{display:none;flex:1;align-items:center;background:#fff;border-radius:20px;padding:2px 3px 2px 6px;gap:2px;border:1px solid #ddd;min-width:0}
.searchExpand.open{display:flex;position:fixed;top:62px;left:10px;right:10px;z-index:200;box-shadow:0 5px 15px rgba(0,0,0,.2)}
.searchExpand input{flex:1;background:transparent;border:none;outline:none;min-width:0;font-size:14px}
.searchExpand .micBtn{width:36px;height:36px;min-width:36px;border:none;background:#fff;border-radius:50%;font-size:18px;cursor:pointer}
.searchExpand .micBtn.listening{background:#ff4444;color:#fff}
.searchExpand .closeBtn{width:30px;height:30px;border:none;background:transparent;font-size:16px}
.bellBtn{width:34px;height:34px;min-width:34px;border:none;background:#eee;border-radius:50%;font-size:16px;position:relative}
.bellBtn i{position:absolute;top:4px;right:5px;width:8px;height:8px;background:red;border-radius:50%;display:block}
#installBtn{padding:9px 14px;border:none;border-radius:20px;font-weight:700;font-size:13px;white-space:nowrap;color:#fff;cursor:pointer}
#installBtn.green{background:#16a34a}
#installBtn.blue{background:#2563eb}
#installBtn.installing{background:#f59e0b}
.setBtn{width:34px;height:34px;border:none;background:#eee;border-radius:50%;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 10px;white-space:nowrap}
.chip{background:#eee;padding:6px 14px;border-radius:20px;font-size:13px}
.chip.active{background:#000;color:#fff}
#adsPlayer{width:100%;height:210px;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
#adsPlayer span{position:absolute;top:8px;left:8px;background:#FF6A00;padding:3px 8px;border-radius:10px;font-size:11px}
#feedBox{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.shortCard{height:280px;background:#000;color:#fff;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;margin:0;cursor:pointer}
.shortCard .playBtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:50px}
.longCard{padding:10px;grid-column:1/3;cursor:pointer}
.longCard video{width:100%;height:180px;border-radius:12px;background:#000}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:150}
.bottom div{text-align:center;font-size:12px;cursor:pointer}
.popup{position:fixed;left:10px;right:10px;bottom:80px;background:#fff;border:1px solid #ddd;padding:14px;border-radius:14px;display:none;z-index:300;max-height:70vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.popup select,
.popup input{width:100%;padding:9px;margin-top:8px;border:1px solid #ddd;border-radius:8px}
.popup button{padding:9px 12px;border:none;border-radius:8px;background:#FF6A00;color:#fff;margin-top:8px}
.goog-te-banner-frame,
.goog-te-gadget,
#goog-gt-tt,
.goog-te-balloon-frame{display:none!important}
body{top:0!important}
</style>
</head>
<body translate="no" class="notranslate">
<div class="top">
<img class="logoImg" src="https://raw.githubusercontent.com/BHARATFLIX/bharat-flix/main/logo.png" alt="Bharat Flix">
<b class="brand3d">Bharat<br><span>Flix</span></b>
<button id="searchIconBtn" class="searchIconBtn" onclick="openSearch()">🔍</button>
<div id="searchExpand" class="searchExpand">
<span>🔍</span>
<input id="searchInput" placeholder="Search..." autocomplete="off" translate="no" class="notranslate" oninput="doSearch(this.value)" onkeydown="if(event.key==='Enter')doSearch(this.value)">
<button type="button" id="micBtn" class="micBtn" onclick="voiceSearch()">🎙️</button>
<button class="closeBtn" onclick="closeSearch()">✕</button>
</div>
<button class="bellBtn" onclick="togglePop('notiBox')">🔔<i></i></button>
<button id="installBtn" class="green" onclick="installApp()">Install</button>
<button class="setBtn" onclick="togglePop('settingsBox')">⚙️</button>
</div>
<div class="chips">
<span class="chip active" data-i18n="all" onclick="filterChip(this,'')">All</span>
<span class="chip" onclick="filterChip(this,'Music')">Music</span>
<span class="chip" onclick="filterChip(this,'Comedy')">Comedy</span>
<span class="chip" onclick="filterChip(this,'Bhakti')">Bhakti</span>
<span class="chip" onclick="filterChip(this,'News')">News</span>
</div>
<div id="adsPlayer" onclick="playAd()">
<span>Ad</span>
<div style="text-align:center">▶️<br><span data-i18n="adText">AdSense Ad</span></div>
</div>
<div id="feedBox"></div>
<p id="noResult" style="display:none;text-align:center;padding:20px;color:#888" data-i18n="noResult">Koi Video Nahi Mili</p>
<p id="loadingMore" style="text-align:center;padding:12px;color:#888;font-size:13px;display:none" data-i18n="loading">Aur Video Aa Rahe Hain...</p>
<div id="notiBox" class="popup">
<b data-i18n="notiTitle">Notifications</b>
<p style="font-size:13px;margin-top:8px">🔴 Bharat Flix ne naya Short dala</p>
<button onclick="togglePop('notiBox')" data-i18n="close">Band Karo</button>
</div>
<div id="settingsBox" class="popup">
<b data-i18n="settingTitle">Setting</b>
<br>
<label data-i18n="langLabel">Language / Bhasha</label>
<select id="appLang" onchange="changeLang(this.value)"></select>
<label data-i18n="qualityLabel">Quality</label>
<select id="appQuality">
<option>Auto</option>
<option>720p</option>
<option>480p</option>
<option>360p</option>
</select>
<button onclick="togglePop('settingsBox')" data-i18n="close">Band Karo</button>
</div>
<div class="bottom">
<div onclick="goHome()">🏠<br><span data-i18n="home">Home</span></div>
<div onclick="filterChip(this,'Short')">🎬<br><span data-i18n="shorts">Shorts</span></div>
<div style="background:#FF6A00;color:#fff;padding:6px 14px;border-radius:12px" onclick="toast('Upload Khul Gaya')">➕<br><span data-i18n="upload">Upload</span></div>
<div onclick="toast('Subs Khul Gaya')">📺<br><span data-i18n="subs">Subs</span></div>
<div onclick="toast('You Khul Gaya')">👤<br><span data-i18n="you">You</span></div>
</div>
<script>
const LANGS=[
["hi","हिन्दी - Hindi"],
["en","English"],
["bn","বাংলা - Bengali"],
["bho","भोजपुरी - Bhojpuri"],
["ta","தமிழ் - Tamil"],
["te","తెలుగు - Telugu"],
["mr","मराठी - Marathi"],
["gu","ગુજરાતી - Gujarati"],
["pa","ਪੰਜਾਬੀ - Punjabi"],
["kn","ಕನ್ನಡ - Kannada"],
["ml","മലയാളം - Malayalam"],
["or","ଓଡ଼ିଆ - Odia"],
["as","অসমীয়া - Assamese"],
["ur","اردو - Urdu"],
["ne","नेपाली - Nepali"],
["sa","संस्कृत - Sanskrit"],
["es","Español - Spanish"],
["fr","Français - French"],
["de","Deutsch - German"],
["it","Italiano - Italian"]
];
const TRANS={
hi:{all:"सभी",adText:"एडसेंस विज्ञापन",noResult:"कोई वीडियो नहीं मिली",loading:"और वीडियो आ रहे हैं...",notiTitle:"सूचनाएं",close:"बंद करो",settingTitle:"सेटिंग",langLabel:"भाषा",qualityLabel:"क्वालिटी",home:"होम",shorts:"शॉर्ट्स",upload:"अपलोड",subs:"सब्स",you:"आप",search:"खोजें..."},
en:{all:"All",adText:"AdSense Ad",noResult:"No Video Found",loading:"More Videos Coming...",notiTitle:"Notifications",close:"Close",settingTitle:"Setting",langLabel:"Language",qualityLabel:"Quality",home:"Home",shorts:"Shorts",upload:"Upload",subs:"Subs",you:"You",search:"Search..."}
};
let langSel=document.getElementById('appLang');
LANGS.forEach(l=>{
let o=document.createElement('option');
o.value=l[0];
o.textContent=l[1];
langSel.appendChild(o);
});
function applyLang(code){
let t=TRANS[code]||TRANS['en'];
document.querySelectorAll('[data-i18n]').forEach(el=>{
let k=el.getAttribute('data-i18n');
if(t[k])el.textContent=t[k];
});
document.getElementById('searchInput').placeholder=t.search||"Search...";
document.documentElement.lang=code;
}
function changeLang(code){
localStorage.setItem('bf_lang',code);
applyLang(code);
toast('Language Badal Gayi - Poora App Badal Gaya');
}
let savedLang=localStorage.getItem('bf_lang')||'hi';
langSel.value=savedLang;
applyLang(savedLang);
function openSearch(){
document.getElementById('searchIconBtn').style.display='none';
document.getElementById('searchExpand').classList.add('open');
setTimeout(()=>document.getElementById('searchInput').focus(),50);
}
function closeSearch(){
document.getElementById('searchExpand').classList.remove('open');
document.getElementById('searchIconBtn').style.display='block';
document.getElementById('searchInput').value='';
doSearch('');
}
function doSearch(q){
q=(q||'').toLowerCase().trim();
let found=0;
document.querySelectorAll('.shortCard,.longCard').forEach(el=>{
let ok=el.innerText.toLowerCase().includes(q);
el.style.display=ok?'':'none';
if(ok)found++;
});
document.getElementById('noResult').style.display=found===0?'block':'none';
}
let micRec=null;
let micOn=false;
async function voiceSearch(){
let micBtn=document.getElementById('micBtn');
if(micOn&&micRec){
try{micRec.stop();}catch(e){}
return;
}
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){
toast('Is Browser Me Mic Nahi Chalega - Chrome Me Kholiye');
return;
}
toast('Mic Permission Maang Raha Hu - Allow Dabao');
try{
let perm=await navigator.permissions.query({name:'microphone'});
if(perm.state==='denied'){
toast('Mic Block Hai - Upar Lock Dabao - Mic Allow Karo - Phir Reload Karo');
return;
}
}catch(e){}
try{
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
stream.getTracks().forEach(t=>t.stop());
}catch(err){
toast('Mic Allow Karo - Upar Allow Dabao - Block Hai To Lock Se Allow Karo');
return;
}
micRec=new SR();
micRec.lang=document.getElementById('appLang').value==='hi'?'hi-IN':'en-US';
micRec.interimResults=false;
micRec.maxAlternatives=1;
micRec.continuous=false;
micRec.onstart=function(){
micOn=true;
micBtn.classList.add('listening');
micBtn.textContent='🔴';
toast('Bolo... Sun Raha Hu...');
};
micRec.onresult=function(e){
let txt=e.results[0][0].transcript;
document.getElementById('searchInput').value=txt;
document.getElementById('searchExpand').classList.add('open');
document.getElementById('searchIconBtn').style.display='none';
doSearch(txt);
toast('Mil Gaya - '+txt);
};
micRec.onerror=function(e){
micOn=false;
micBtn.classList.remove('listening');
micBtn.textContent='🎙️';
if(e.error==='not-allowed'){
toast('Mic Allow Karo - Allow Dabao');
}else if(e.error==='no-speech'){
toast('Awaaz Nahi Aayi - Dobara Bolo');
}else{
toast('Mic Me Problem Hai - Dobara Dabao');
}
};
micRec.onend=function(){
micOn=false;
micBtn.classList.remove('listening');
micBtn.textContent='🎙️';
};
try{
micRec.start();
}catch(err){
toast('Mic Dobara Dabao');
micOn=false;
}
}
function toast(m){
let d=document.createElement('div');
d.textContent=m;
d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:8px 14px;border-radius:20px;z-index:999;font-size:13px';
document.body.appendChild(d);
setTimeout(()=>d.remove(),3000);
}
function togglePop(id){
let e=document.getElementById(id);
let wasOpen=e.style.display==='block';
document.querySelectorAll('.popup').forEach(p=>p.style.display='none');
if(!wasOpen)e.style.display='block';
}
function filterChip(el,word){
document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
if(el&&el.classList)el.classList.add('active');
doSearch(word);
}
let deferredPrompt=null;
let installBtn=document.getElementById('installBtn');
function setInstallState(){
installBtn.className='green';
installBtn.textContent='Install';
}
setInstallState();
window.addEventListener('beforeinstallprompt',e=>{
e.preventDefault();
deferredPrompt=e;
});
function installApp(){
if(localStorage.getItem('bf_installed')==='1'){
toast('Pehle Se Install Hai');
goHome();
return;
}
installBtn.className='installing';
installBtn.textContent='Installing...';
if(deferredPrompt){
deferredPrompt.prompt();
deferredPrompt.userChoice.then(r=>{
if(r.outcome==='accepted'){finishInstall();}
else{setInstallState();}
deferredPrompt=null;
});
}else{
setTimeout(()=>{
finishInstall();
toast('Home Screen Par Dekho - App Aa Gaya');
},2000);
}
}
function finishInstall(){
localStorage.setItem('bf_installed','1');
setInstallState();
toast('Install Ho Gaya');
goHome();
}
function goHome(){
document.querySelectorAll('.popup').forEach(p=>p.style.display='none');
document.getElementById('searchExpand').classList.remove('open');
document.getElementById('searchIconBtn').style.display='block';
window.scrollTo(0,0);
doSearch('');
}
function playAd(){
toast('Ad Chal Raha Hai');
}
let allVideos=[
{type:'short',title:'Short 1 - Comedy'},
{type:'short',title:'Short 2 - Bhakti'},
{type:'short',title:'Short 3 - Music'},
{type:'long',title:'Long 1 - Bharat Flix Welcome'},
{type:'short',title:'Short 4 - News'},
{type:'short',title:'Short 5 - Gaming'},
{type:'long',title:'Long 2 - Bhakti Special'},
{type:'short',title:'Short 6 - Kirtan'}
];
let shown=0;
function renderFeed(){
let box=document.getElementById('feedBox');
let end=Math.min(shown+6,allVideos.length);
for(let i=shown;i<end;i++){
let v=allVideos[i];
if(v.type==='short'){
let d=document.createElement('div');
d.className='shortCard';
d.onclick=()=>toast(v.title+' Chal Raha Hai');
d.innerHTML=`<div class="playBtn">▶️</div><div><b>${v.title}</b><p style="font-size:11px">Bharat Flix</p></div>`;
box.appendChild(d);
}else{
let d=document.createElement('div');
d.className='longCard';
d.onclick=()=>toast(v.title+' Chal Raha Hai');
d.innerHTML=`<video></video><b>${v.title}</b>`;
box.appendChild(d);
}
}
shown=end;
}
renderFeed();
</script>
</body>
</html>
