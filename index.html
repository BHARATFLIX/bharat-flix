<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat Flix - भारत का अपना OTT</title>
<style>
body{margin:0; font-family:Arial, sans-serif; background:linear-gradient(to bottom, #ff9933 0%, #ff9933 35%, #ffffff 35%, #ffffff 65%, #138808 65%, #138808 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:15px;}
.card{background:white; width:100%; max-width:380px; border-radius:30px; border:3px solid #ffcc00; text-align:center; padding:25px 20px 20px; position:relative; margin-top:60px; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
.logo{width:110px; height:110px; background:linear-gradient(to bottom, #ff9933, white, #138808); border-radius:25px; border:4px solid #ffcc00; display:flex; justify-content:center; align-items:center; font-size:65px; font-weight:900; color:#e6b800; position:absolute; top:-55px; left:50%; transform:translateX(-50%); box-shadow:0 5px 15px rgba(0,0,0,0.2);}
.title{color:#f7b500; font-size:32px; font-weight:900; margin-top:60px; letter-spacing:1px;}
.sub{color:#0a8a0a; font-weight:bold; margin:5px 0 15px; font-size:16px;}
.welcome{color:#c0392b; font-size:19px; font-weight:800; line-height:1.4; margin-bottom:18px;}
.msgbox{background:#fdf6e3; border-left:5px solid #ff9933; border-right:5px solid #138808; border-radius:15px; padding:12px; font-weight:600; line-height:1.5; color:#333; margin-bottom:20px;}

/* आपका वही कलर, और हिलने वाला */
.install-btn{background:linear-gradient(90deg, #ff8c00, #ffcc00); border:none; width:100%; padding:15px; border-radius:50px; font-size:20px; font-weight:900; color:black; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.2); animation: hilna 2s infinite;}
@keyframes hilna{
0%,100%{transform:translateX(0) scale(1);}
10%,30%,50%{transform:translateX(-4px) scale(1.02);}
20%,40%{transform:translateX(4px) scale(1.02);}
}
.install-btn:active{transform:scale(0.97);}

.footer{font-size:12px; color:gray; margin-top:12px; font-weight:600;}
.ad-box{width:100%; border-radius:15px; overflow:hidden; background:black; margin-bottom:15px; border:2px solid #ffcc00;}
.ad-box video{width:100%; display:block; max-height:350px;}
</style>
</head>
<body>
<div class="card">
<div class="logo">B</div>
<div class="title">BHARAT FLIX</div>
<div class="sub">🇮🇳 भारत का अपना OTT 🇮🇳</div>

<div class="ad-box">
<video src="ad-new.mp4" autoplay muted loop controls playsinline></video>
</div>

<div class="welcome">भारत फ्लिक्स में आपका स्वागत है!<br>हमेशा जुड़े रहिए भारत फ्लिक्स से,<br>ये आपका अपना प्लेटफॉर्म है।</div>

<div class="msgbox">🙏 ये आपका खुद का प्लेटफॉर्म है,<br>यहाँ सब अपने हैं।<br>ये बहुत बड़ा परिवार होने वाला है!</div>

<button class="install-btn" id="installBtn">📱 अभी इंस्टॉल करें - यहाँ टच करें</button>

<div class="footer">✅ सिर्फ 15MB | 100% सुरक्षित | Made in Bharat<br>टच करते ही डाउनलोड शुरू होगा</div>
</div>

<script>
let deferredPrompt;
const btn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
btn.addEventListener('click', async () => {
  btn.style.animation = 'none';
  if (deferredPrompt) {
    deferredPrompt.prompt();
    btn.innerHTML = "⏳ Installing...";
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      btn.innerHTML = "✅ Open - अब खोलें";
      setTimeout(()=>{ window.location.href = "/login.html"; }, 1000);
    } else {
      btn.innerHTML = "📱 अभी इंस्टॉल करें - यहाँ टच करें";
      btn.style.animation = 'hilna 2s infinite';
    }
    deferredPrompt = null;
  } else {
    btn.innerHTML = "⏳ Installing...";
    setTimeout(()=>{
      btn.innerHTML = "✅ Open - अब खोलें";
      window.location.href = "/login.html";
    }, 2000);
  }
});
</script>
</body>
</html>
