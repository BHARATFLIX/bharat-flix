<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix 🇮🇳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
body{max-width:400px;margin:0 auto;background:#fff;padding-bottom:80px}
.header{position:sticky;top:0;background:#fff;z-index:1002;display:flex;align-items:center;gap:6px;padding:7px 8px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.logo{display:flex;align-items:center;gap:5px;font-weight:900;font-size:18px;flex-shrink:0}
.logo img{width:36px;height:36px;border-radius:50%;border:2px solid #FF9933}
.b{color:#FF9933}.f{color:#138808}
.search{flex:1;background:#f2f2f2;border-radius:20px;padding:8px 10px;font-size:12px;color:#606060;cursor:pointer;min-width:0}
.icon{width:32px;height:32px;background:#f2f2f2;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.profile{width:32px;height:32px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;border:1px solid #ddd;cursor:pointer;flex-shrink:0}
.install{padding:7px 10px;background:#0b57d0;color:#fff;border:none;border-radius:18px;font-weight:800;cursor:pointer;flex-shrink:0;font-size:11px}
.video-wrap{position:sticky;top:48px;z-index:1000;background:#fff;padding:6px 0 10px 0}
.video{width:96%;margin:0 auto;aspect-ratio:16/10;background:#000;border-radius:14px;overflow:hidden;position:relative}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:rgba(0,0,0,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;z-index:2;cursor:pointer}
#skipBox{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.9);color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;display:none;z-index:5}
#toast{position:absolute;bottom:14px;left:12px;background:rgba(0,0,0,.8);color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;display:none;z-index:3}
.info{padding:10px 14px}.title{font-size:16px;font-weight:700}
.meta{display:flex;align-items:center;gap:10px;margin-top:10px}
.b-logo{width:40px;height:40px;background:linear-gradient(135deg,#FF9933,#138808);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.ch-name{flex:1;font-size:13px}
.btns{display:flex;gap:6px}.btns button{padding:8px 16px;border-radius:22px;border:none;font-weight:800;font-size:12px;cursor:pointer}
.sub{background:#FF0000;color:#fff}.join{background:#000;color:#fff}
.swipe{display:flex;gap:8px;overflow-x:auto;padding:12px}.swipe div{flex:0 0 auto;background:#f2f2f2;border-radius:22px;padding:9px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.feed{padding:8px}.v-card{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee;cursor:pointer}.v-card video{width:168px;height:94px;border-radius:12px;object-fit:cover;background:#000}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:400px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:999}
.btm-item{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#606060;cursor:pointer}
.upload{background:linear-gradient(90deg,#FF9933,#138808);width:46px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:900}
#pop{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:400px;height:100%;background:rgba(0,0,0,.75);z-index:10000;display:none;align-items:center;justify-content:center}
.pop-box{background:#fff;width:90%;border-radius:18px;padding:18px}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><img src="logo.png?v=final"><span><span class="b">Bharat</span><span class="f">Flix</span></span></div>
  <div class="search" id="searchBtn">🔍 Search</div>
  <div class="icon" id="micBtn">🎤</div>
  <div class="icon" id="bellBtn">🔔</div>
  <div class="icon" id="setBtn">⚙️</div>
  <button class="install" id="installBtn">Install</button>
  <div class="profile" id="profileBtn">👤</div>
</div>
<div id="pop"><div class="pop-box" id="popContent"></div></div>
<div class="video-wrap"><div class="video"><video id="myVideo" poster="logo.png" controls playsinline preload="metadata"></video><div class="play" id="playBtn">▶</div><div id="skipBox"></div><div id="toast"></div></div></div>
<div class="info"><div class="title" id="mainTitle">BharatFlix Aapka Apna Swadeshi Platform 🇮🇳</div><div class="meta"><div class="b-logo">B</div><div class="ch-name"><b>BharatFlix Official</b><br><span style="color:#606060;font-size:12px">1.2M • 45K views</span></div><div class="btns"><button class="sub" id="subBtn">Subscribe</button><button class="join" id="joinBtn">Join FREE</button></div></div></div>
<div class="swipe"><div id="likeBtn">👍 15K Like</div><div id="dislikeBtn">👎 12K</div><div id="shareBtn">↗️ Share</div><div id="downloadBtn">⬇️ Download</div></div>
<div class="feed" id="videoFeed"><div style="text-align:center;padding:20px;color:#888">⏳ ला रहे हैं... 🇮🇳</div></div>
<div class="bottom"><div class="btm-item" id="homeBtn">🏠<span>Home</span></div><div class="btm-item" id="shortsBtn">🎬<span>Shorts</span></div><div class="btm-item" id="uploadBtn"><div class="upload">+</div>Upload</div><div class="btm-item" id="subsBtn">📺<span>Subs</span></div><div class="btm-item" id="jobsBtn">💼<span>Jobs</span></div></div>
<input type="file" id="fileInput" accept="video/*" style="display:none">
<script>
const SUPA_URL = "https://dvaawuhwetwmmziucyow.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2YWF3dWh3ZXR3bW16aXVjeW93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MjM2NDcsImV4cCI6MjEwOTI5OTY0N30.2tqmnZbn_4_LKSet1JPKdTNKpzgy6y_i03V_AajCktI";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500);}
function addFeedUI(title,url,isNew=false){
  let f=document.getElementById('videoFeed');
  if(f.innerHTML.includes('ला रहे'))f.innerHTML="";
  let d=document.createElement('div');d.className='v-card';
  d.innerHTML=`<video src="${url}" muted preload="metadata"></video><div style="flex:1"><b style="font-size:13px">${title}</b><br><span style="font-size:11px;color:#138808;font-weight:700">● पक्का गोदाम ✅</span></div>`;
  d.onclick=()=>{let v=document.getElementById('myVideo');v.src=url;v.play();document.getElementById('mainTitle').innerText=title;document.getElementById('playBtn').style.display='none';window.scrollTo(0,0);};
  if(isNew)f.prepend(d);else f.appendChild(d);
}
async function loadFromGodam(){
  const {data,error} = await supa.from('videos').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('videoFeed').innerHTML=error.message;return;}
  if(!data || data.length==0){document.getElementById('videoFeed').innerHTML=`<div style="text-align:center;padding:30px"><b>स्वागत!</b><br><button onclick="document.getElementById('uploadBtn').click()" style="background:linear-gradient(90deg,#FF9933,#138808);color:#fff;border:none;padding:12px 24px;border-radius:24px;font-weight:900;margin-top:10px">+ पहली वीडियो डालो</button></div>`;return;}
  document.getElementById('videoFeed').innerHTML="";data.forEach(r=>{if(r.video_url)addFeedUI(r.title,r.video_url);});
}
loadFromGodam();
document.getElementById('uploadBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async e => {
  let file = e.target.files[0]; if(!file) return;
  let v = document.getElementById('myVideo'); let box = document.getElementById('skipBox');
  box.style.display='block'; box.innerText='⏳ 0% भेज रहे हैं...';
  document.getElementById('playBtn').style.display='none';
  document.getElementById('mainTitle').innerText = "⏳ अपलोड: "+file.name;
  try{
    const name = Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.]/g,'_');
    box.innerText='⏳ 50% गोदाम में भेज रहे हैं...';
    const {error: upErr} = await supa.storage.from('videos').upload(name, file);
    if(upErr) throw upErr;
    box.innerText='⏳ 80% लिंक बना रहे हैं...';
    const {data: urlData} = supa.storage.from('videos').getPublicUrl(name);
    const downloadURL = urlData.publicUrl;
    box.innerText='⏳ 95% DB में सेव कर रहे हैं...';
    // FIXED: सिर्फ 2 column भेज रहे हैं - telegram_id हटाया!
    const {error: dbErr} = await supa.from('videos').insert([{title: file.name, video_url: downloadURL}]);
    if(dbErr) throw dbErr;
    box.innerText='✅ हो गया! 🇮🇳';setTimeout(()=>box.style.display='none',3000);
    toast('✅ Save हो गया! 🇮🇳');
    addFeedUI(file.name,downloadURL,true);
    v.src=downloadURL; v.play();
    document.getElementById('mainTitle').innerText = file.name + " ✅ पक्का गोदाम में!";
  }catch(err){
    box.innerText='❌ '+err.message;
    toast('❌ '+err.message);
  }
};
document.getElementById('playBtn').onclick=()=>{document.getElementById('myVideo').play();document.getElementById('playBtn').style.display='none'};
document.getElementById('myVideo').onpause=()=>document.getElementById('playBtn').style.display='flex';
document.getElementById('myVideo').onplay=()=>document.getElementById('playBtn').style.display='none';
const pop=document.getElementById('pop'),popContent=document.getElementById('popContent');
function showPop(h){popContent.innerHTML=h;pop.style.display='flex'}pop.onclick=e=>{if(e.target==pop)pop.style.display='none'}
document.getElementById('searchBtn').onclick=()=>showPop(`<b>Search</b><br>काम कर रहा है`);
document.getElementById('setBtn').onclick=()=>showPop(`<b>Fix v7</b><br>telegram_id column हटाया, अब चलेगा`);
document.getElementById('bellBtn').onclick=()=>toast('🔔 ON');
document.getElementById('micBtn').onclick=()=>document.getElementById('searchBtn').click();
document.getElementById('profileBtn').onclick=()=>showPop(`<b>👤 You FREE</b>`);
document.getElementById('jobsBtn').onclick=()=>toast('💼 Jobs');
document.getElementById('subBtn').onclick=function(){this.innerText=this.innerText=='Subscribe'?'Subscribed ✅':'Subscribe'};
document.getElementById('homeBtn').onclick=()=>window.scrollTo(0,0);
document.getElementById('installBtn').onclick=()=>toast('Add to Home Screen');
};
</script>
</body>
</html>
