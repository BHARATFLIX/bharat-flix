<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>BharatFlix - Look Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#f5f5f5;font-family:system-ui}
.header{background:#fff;padding:12px 14px;border-radius:0 0 18px 18px;box-shadow:0 2px 10px #0001}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-row img{width:52px;height:58px;object-fit:contain}
.bharat{font-size:42px;font-weight:900;background:linear-gradient(90deg,#FF9933 0 33%,#ffffff 33% 66%,#138808 66% 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.2px #000;filter:drop-shadow(0 3px 0 #000) drop-shadow(2px 2px 4px #0005)}
.top-bar{display:flex;justify-content:flex-end;gap:18px;font-size:22px;padding:8px 4px}
.video-box{width:96%;margin:14px auto;background:#000;border-radius:18px;aspect-ratio:16/9;position:relative;overflow:hidden}
.action-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#fff;white-space:nowrap;scrollbar-width:none}
.action-scroll::-webkit-scrollbar{display:none}
.action-scroll button{flex:0 0 auto;border:1px solid #e5e5e5;background:#f2f2f2;padding:8px 14px;border-radius:20px;font-weight:600;font-size:13px}
.sensor-row{display:flex;gap:8px;padding:12px;overflow-x:auto;background:#fff;margin-top:8px}
.sensor{flex:0 0 auto;padding:8px 12px;border-radius:12px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.s1{background:#d1fae5;color:#065f46}.s2{background:#dbeafe;color:#1e40af}.s3{background:#fde7f8;color:#6b21a8}.s4{background:#ffedd5;color:#9a3412}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd;z-index:99}
.bottom div{text-align:center;font-size:12px}
#myAd{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#myAd video{width:100%;height:100%;object-fit:contain}
#closeBox{position:absolute;bottom:25px;left:0;width:100%;text-align:center}
.skip{background:#fff;color:#000;border:none;padding:10px 25px;border-radius:30px;font-weight:bold;font-size:16px;margin:3px}
#installBtn{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#FF9933,#FF6A00 50%,#138808);color:#fff;border:2px solid #fff;padding:14px 32px;border-radius:50px;font-size:17px;font-weight:900;box-shadow:0 5px 20px #0008;z-index:90;animation:pop 1s infinite}
@keyframes pop{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1)}}
</style>
</head>
<body>

<div id="myAd">
  <video id="adVideo" autoplay muted playsinline><source src="ad-new.mp4" type="video/mp4"></video>
  <div id="closeBox">
    <button class="skip" onclick="unmuteAd()" style="background:#FF9933;color:#fff">🔊 आवाज चालू करें</button>
    <button class="skip" onclick="closeAd()">Skip Ad ✕</button>
