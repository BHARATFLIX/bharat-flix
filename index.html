const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

function toast(t){
  let e = document.getElementById('toast');
  e.innerText = t;
  e.style.display = 'block';
  setTimeout(()=>{
    e.style.display = 'none';
  },3000);
}

function addFeedUI(title, desc, category, url, isNew=false){
  let f = document.getElementById('videoFeed');
  if(f.innerHTML.includes('लोड हो रहा')){
    f.innerHTML = "";
  }
  let d = document.createElement('div');
  d.className = 'v-card';
  let safeDesc = desc ? desc.substring(0,80) : title;
  let safeCat = category || 'Other';
  d.innerHTML = `<video src="${url}" muted preload="metadata"></video><div style="flex:1"><b style="font-size:13px;line-height:1.3">${title}</b><br><span style="font-size:12px;color:#606060;display:block;margin-top:4px;line-height:1.3">${safeDesc}</span><br><span style="font-size:11px;background:#f1f1f1;padding:3px 8px;border-radius:10px">📁 ${safeCat}</span></div>`;
  d.onclick = ()=>{
    let v = document.getElementById('myVideo');
    v.src = url;
    v.play();
    document.getElementById('mainTitle').innerText = title;
    document.getElementById('playBtn').style.display = 'none';
    window.scrollTo(0,0);
  };
  if(isNew){
    f.prepend(d);
  } else {
    f.appendChild(d);
  }
}

async function loadFromGodam(){
  try{
    const {data, error} = await supa.from('videos').select('*').order('created_at',{ascending:false});
    if(error){
      throw error;
    }
    if(!data || data.length==0){
      document.getElementById('videoFeed').innerHTML = '<div style="text-align:center;padding:30px"><p style="font-size:40px">🇮🇳</p><b>स्वागत है!</b><br><button onclick="document.getElementById(\'uploadBtn\').click()" style="background:linear-gradient(90deg,#FF9933,#138808);color:#fff;border:none;padding:12px 24px;border-radius:24px;font-weight:900;margin-top:10px">+ पहली वीडियो डालो</button></div>';
      return;
    }
    document.getElementById('videoFeed').innerHTML = "";
    data.forEach(row=>{
      if(row.video_url){
        addFeedUI(row.title, row.description || row.title, row.category || 'Other', row.video_url);
      }
    });
  }catch(e){
    document.getElementById('videoFeed').innerHTML = '<div style="text-align:center;padding:20px">Error: '+e.message+'</div>';
  }
}

document.getElementById('finalUploadBtn').onclick = async ()=>{
  if(!selectedFile) return;
  let title = document.getElementById('v_title').value.trim();
  let desc = document.getElementById('v_desc').value.trim();
  let cat = document.getElementById('v_category').value;
  if(!title||!desc){
    toast('Title + Description जरूरी');
    return;
  }
  let prog = document.getElementById('uploadProgress');
  prog.style.display = 'block';
  prog.innerText = '⏳ 50% Upload...';
  try{
    const name = Date.now()+'_'+selectedFile.name.replace(/[^a-zA-Z0-9.]/g,'_');
    const {error:upErr} = await supa.storage.from('videos').upload(name, selectedFile);
    if(upErr) throw upErr;
    prog.innerText = '⏳ 80% लिंक बना रहा...';
    const {data:urlData} = supa.storage.from('videos').getPublicUrl(name);
    const downloadURL = urlData.publicUrl;
    prog.innerText = '⏳ 90% Save हो रहा...';
    try{
      const {error} = await supa.from('videos').insert([{
        title:title,
        description:desc,
        category:cat,
        video_url:downloadURL
      }]);
      if(error) throw error;
    }catch(err){
      const {error:simpleErr} = await supa.from('videos').insert([{
        title:title,
        video_url:downloadURL
      }]);
      if(simpleErr) throw simpleErr;
    }
    prog.innerText = '✅ Save हो गया!';
    setTimeout(()=>{
      document.getElementById('uploadDetails').style.display = 'none';
      prog.style.display = 'none';
    },1000);
    addFeedUI(title, desc, cat, downloadURL, true);
    document.getElementById('myVideo').src = downloadURL;
    document.getElementById('myVideo').play();
    document.getElementById('mainTitle').innerText = title;
    toast('✅ Save हो गया - अब गायब नहीं होगा 🇮🇳');
  }catch(err){
    prog.innerText = '❌ '+err.message;
    toast('❌ '+err.message);
  }
};

const myVideo = document.getElementById('myVideo');
const playBtn = document.getElementById('playBtn');
const fsBtn = document.getElementById('fsBtn');
const videoWrap = document.getElementById('videoWrap');
const videoContainer = document.getElementById('videoContainer');
const rotateHint = document.getElementById('rotateHint');

playBtn.onclick = ()=>{
  myVideo.play();
  playBtn.style.display = 'none';
};
myVideo.onpause = ()=>{
  playBtn.style.display = 'flex';
};

// v37 FINAL PLAYER FIX - KHADA PLAYER BADA, KALI PATTI NAHI, KATEGA NAHI
myVideo.onloadedmetadata = ()=>{
  let w = myVideo.videoWidth;
  let h = myVideo.videoHeight;
  if(w && h){
    if(h > w){
      // खड़ी Video - Player खुद खड़ा, बड़ा, Full जैसा, काली पट्टी खत्म
      videoContainer.style.aspectRatio = w + '/' + h;
      videoContainer.style.maxHeight = '80vh';
      videoContainer.style.width = '100%';
      videoContainer.style.maxWidth = '400px';
    } else {
      // आड़ी Video - Normal 16:9
      videoContainer.style.aspectRatio = '16/9';
      videoContainer.style.maxHeight = 'none';
      videoContainer.style.maxWidth = '100%';
    }
  }
};
myVideo.onplay = ()=>{
  playBtn.style.display = 'none';
  if(myVideo.videoHeight > myVideo.videoWidth){
    videoContainer.style.aspectRatio = myVideo.videoWidth + '/' + myVideo.videoHeight;
    videoContainer.style.maxHeight = '80vh';
  }
};

function toggleFullscreen(){
  if(document.fullscreenElement || document.webkitFullscreenElement){
    if(document.exitFullscreen){
      document.exitFullscreen();
    } else if(document.webkitExitFullscreen){
      document.webkitExitFullscreen();
    }
  } else {
    if(videoWrap.requestFullscreen){
      videoWrap.requestFullscreen();
    } else if(videoWrap.webkitRequestFullscreen){
      videoWrap.webkitRequestFullscreen();
    }
  }
}

fsBtn.onclick = toggleFullscreen;
myVideo.ondblclick = toggleFullscreen;

document.addEventListener('fullscreenchange', ()=>{
  if(document.fullscreenElement){
    rotateHint.style.display = 'block';
    setTimeout(()=>{
      rotateHint.style.display = 'none';
    },2000);
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
  } else {
    if(screen.orientation && screen.orientation.unlock){
      screen.orientation.unlock();
    }
    rotateHint.style.display = 'none';
  }
});

let deferredPrompt = null;
let isInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

function updateInstallBtn(){
  let btn = document.getElementById('installBtn');
  if(isInstalled){
    btn.innerText = '💙 Installed';
    btn.className = 'install';
  } else {
    btn.innerText = '📲 Install';
    btn.className = 'install green';
  }
}
updateInstallBtn();

window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt = e;
  if(!isInstalled){
    let b = document.getElementById('installBtn');
    b.innerText = '📲 Install';
    b.className = 'install green';
  }
});

document.getElementById('installBtn').onclick = async ()=>{
  let btn = document.getElementById('installBtn');
  if(isInstalled){
    toast('✅ Home Screen पर है 🇮🇳');
    return;
  }
  if(deferredPrompt){
    deferredPrompt.prompt();
    const {outcome} = await deferredPrompt.userChoice;
    if(outcome === 'accepted'){
      btn.innerText = '💙 Installed';
      btn.className = 'install';
      toast('✅ Home पर आ गया 🇮🇳');
    }
    deferredPrompt = null;
  } else {
    toast('ऊपर ⋮ > Add to Home Screen दबाओ');
  }
};
