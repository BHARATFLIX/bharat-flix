<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix - Public + Channel</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:12px;margin:0}
h1{color:#ff3d00;text-align:center}
.box{background:#1e1e1e;padding:14px;border-radius:14px;margin-bottom:12px}
input,button{width:100%;padding:12px;margin-top:9px;border-radius:9px;border:none;box-sizing:border-box}
input{background:#333;color:#fff}
button{background:#ff3d00;color:#fff;font-weight:bold}
video{width:100%;border-radius:12px;margin-top:8px;background:#000}
.card{background:#222;padding:10px;border-radius:12px;margin-top:10px}
.small{font-size:13px;color:#aaa}
.chip{display:inline-block;background:#333;padding:7px 12px;border-radius:20px;margin:4px 4px 0 0;font-size:13px}
.active{background:#ff3d00;color:#fff}
.tab{display:flex;gap:8px}
.tab button{background:#333}
.tab button.active{background:#ff3d00}
</style>
</head>
<body>
<h1>🇮🇳 BharatFlix</h1>

<div class="box">
<h3>1. Apna Channel Jodo</h3>
<input id="creatorName" placeholder="Apna Naam - jaise Raju">
<input id="creatorChannel" placeholder="Apne Channel ka ID / @username">
<button onclick="saveChannel()">Channel Jodo</button>
<p id="channelMsg" class="small"></p>
</div>

<div class="box">
<h3>2. Video Upload Karo</h3>
<input id="videoTitle" placeholder="Video ka naam">
<input type="file" id="videoFile" accept="video/*">
<button onclick="uploadVideo()">Upload - Public + Godam + Channel</button>
<p id="uploadMsg" class="small"></p>
</div>

<div class="box">
<h3>3. BharatFlix Dekho</h3>
<div class="tab">
<button id="btnPublic" class="active" onclick="setMode('public')">🌍 Public - Sabki Video</button>
<button id="btnMy" onclick="setMode('my')">📺 Mera Channel</button>
</div>
<div id="channelList"></div>
<div id="videoList"></div>
<p class="small">Public me sabki video dikhegi - isi se Views + Monetization aayega bhaiya. Mera Channel me sirf uski video dikhegi.</p>
</div>

<script>
let creatorChannels = JSON.parse(localStorage.getItem("bf_channels")||"{}");
let allVideos = JSON.parse(localStorage.getItem("bf_videos")||"[]");
let mode="public";
let selectedChannel="all";

function saveChannel(){
  let n=document.getElementById("creatorName").value.trim();
  let c=document.getElementById("creatorChannel").value.trim();
  if(!n||!c){alert("Naam aur Channel ID dalo");return;}
  creatorChannels[n]=c;
  localStorage.setItem("bf_channels",JSON.stringify(creatorChannels));
  document.getElementById("channelMsg").innerText="Ho gaya bhaiya! "+n+" ka channel jud gaya";
  showVideos();
}

async function uploadVideo(){
  let title=document.getElementById("videoTitle").value.trim();
  let file=document.getElementById("videoFile").files[0];
  let creator=document.getElementById("creatorName").value.trim();
  if(!title||!file||!creator){alert("Naam, Title aur Video chuno");return;}
  document.getElementById("uploadMsg").innerText="Upload ho raha hai... Public + Godam + Channel teeno me ja raha hai...";

  let fd=new FormData();
  fd.append("title",title); fd.append("creator",creator);
  fd.append("video",file);
  fd.append("creatorChannel",creatorChannels[creator]||"");
  fd.append("isPublic","true"); // Public bhi hai bhaiya

  let file_id="local_"+Date.now();
  try{ let res=await fetch("/api/upload",{method:"POST",body:fd}); let d=await res.json(); if(d.file_id) file_id=d.file_id; }catch(e){}

  let v={title:title,creator:creator,channel:creatorChannels[creator]||"",file_id:file_id,url:URL.createObjectURL(file),isPublic:true,time:Date.now()};
  allVideos.unshift(v);
  localStorage.setItem("bf_videos",JSON.stringify(allVideos.map(x=>({...x,url:""}))));
  showVideos();
  document.getElementById("uploadMsg").innerText="Ho gaya bhaiya! Video PUBLIC me + Godam me + "+creator+" ke Channel me - teeno jagah chali gayi";
}

function setMode(m){
  mode=m;
  document.getElementById("btnPublic").className=m=="public"?"active":"";
  document.getElementById("btnMy").className=m=="my"?"active":"";
  showVideos();
}
function selectChannel(n){selectedChannel=n;showVideos();}

function showVideos(){
  let myName=document.getElementById("creatorName").value.trim();
  let chHtml=`<span class="chip ${selectedChannel=="all"?"active":""}" onclick="selectChannel('all')">Sab Channel</span>`;
  Object.keys(creatorChannels).forEach(n=>{ chHtml+=`<span class="chip ${selectedChannel==n?"active":""}" onclick="selectChannel('${n}')">${n} ka Channel</span>`; });
  document.getElementById("channelList").innerHTML=chHtml;

  let list=allVideos;
  // PUBLIC MODE - BharatFlix kholega to sabki video
  if(mode=="public"){ list=list.filter(v=>v.isPublic); }
  // MY CHANNEL MODE - Channel wala kholega to sirf uski video
  if(mode=="my" && myName){ list=list.filter(v=>v.creator==myName); }
  if(selectedChannel!="all"){ list=list.filter(v=>v.creator==selectedChannel); }

  let h="";
  list.forEach(v=>{
    h+=`<div class="card"><b>${v.title}</b><br><span class="small">Creator: ${v.creator} | Channel: ${v.channel} | 🌍 Public</span><br>
    ${v.url?`<video controls src="${v.url}"></video>`:`<video controls src="/api/play?file_id=${v.file_id}"></video>`}
    <p class="small">Ye video Public me bhi hai aur ${v.creator} ke channel me bhi hai</p></div>`;
  });
  document.getElementById("videoList").innerHTML=h||"<p class='small'>Abhi yahan koi video nahi hai bhaiya</p>";
}
showVideos();
</script>
</body>
</html>
