<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix - FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff;padding-bottom:70px}
.tiranga{height:4px;display:flex}.tiranga div{flex:1}
.s{background:#FF9933}.w{background:#fff}.g{background:#138808}
header{display:flex;justify-content:space-between;padding:12px 16px;background:#212121;position:sticky;top:0}
.logo{font-weight:bold;font-size:20px}.logo span{color:red}
.ad{background:#1a1a1a;margin:10px;padding:12px;text-align:center;border:1px dashed #444;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:14px}
.card{background:#181818;border-radius:12px;overflow:hidden}
.thumb{aspect-ratio:16/9;background:#222;display:flex;align-items:center;justify-content:center;position:relative}
.info{padding:10px}.channel{color:#aaa;font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#212121;display:flex;justify-content:space-around;padding:8px;border-top:1px solid #333}
.bottom div{text-align:center;font-size:11px;color:#aaa}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:999;align-items:center;justify-content:center;padding:20px}
.box{background:#212121;padding:20px;border-radius:12px;width:100%;max-width:450px}
.box input,.box select{width:100%;padding:10px;margin:6px 0;background:#111;border:1px solid #333;color:#fff;border-radius:6px}
.btn{padding:12px;background:red;color:#fff;border:none;border-radius:25px;width:100%;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="tiranga"><div class="s"></div><div class="w"></div><div class="g"></div></div>
<header><div class="logo"><span>Bharat</span>Flix 🇮🇳</div><div onclick="document.getElementById('upload').style.display='flex'">⬆️</div></header>

<div class="ad">
<b>TOP AD - Yahan AdSense Code Paste Karo</b>
<div id="ad-slot" style="background:#222;margin-top:8px;padding:20px;border-radius:6px">Ad Area</div>
</div>

<div class="grid">
<div class="card"><div class="thumb">🛕 Banke Bihari LIVE</div><div class="info"><b>Vrindavan Live - FINAL LOCKED DESIGN</b><br><span class="channel">Bhakti TV • 1.2M • 👍24K 👎 ↗️ ⬇️ 💾</span></div></div>
</div>

<div class="bottom"><div>🏠 Home</div><div>▶️ Shorts</div><div onclick="document.getElementById('upload').style.display='flex'">➕ Create</div><div>📺 Subs</div><div>📚 Lib</div></div>

<div class="modal" id="upload"><div class="box">
<h3>Upload FINAL</h3>
<select id="role"><option value="user">Normal User</option><option value="reporter">News Reporter</option></select>
<input type="file" id="file" accept="video/*">
<input type="text" id="title" placeholder="Title likho">
<button class="btn" onclick="uploadBunny()">FINAL Upload to Bunny</button>
<button class="btn" style="background:#333" onclick="document.getElementById('upload').style.display='none'">Cancel</button>
<div id="status" style="margin-top:10px;font-size:12px"></div>
</div></div>

<script>
// === FINAL LOCKED KEYS - ENCODED ===
const _k1 = atob("ZmIzNjZkMjEtNWJmMy00YzY3LWIzODdhMGY5YmVlOC1kNWVlLTQxMjE=");
const _k2 = atob("YjEzMzlhMjAtYjVjZC00YzNhLTk5MWFiZjc4MDY4MS0yNTY1LTQwNjI=");
const STORAGE = "bharatflix"; // Agar Bunny Storage ka naam alag hai to yahan badal dena

async function uploadBunny(){
 const f=document.getElementById('file').files[0]; const t=document.getElementById('title').value; const r=document.getElementById('role').value; const s=document.getElementById('status');
 if(!f||!t){s.innerText="File + Title bharo";return;}
 let fail=""; const lt=t.toLowerCase();
 if(["xxx","porn","nude"].some(w=>lt.includes(w))&&r!="reporter") fail="गंदी Video - Reporter only";
 if(["fight","मारपीट"].some(w=>lt.includes(w))) fail="लड़ाई Block";
 if(["drug","नशा"].some(w=>lt.includes(w))) fail="नशा Block";
 if(fail){s.style.color="red";s.innerText=fail+" => Pending me";return;}
 s.style.color="#0f0"; s.innerText="Bunny pe ja raha hai...";
 try{
   const url=`https://storage.bunnycdn.com/${STORAGE}/${Date.now()}_${f.name}`;
   const res=await fetch(url,{method:"PUT",headers:{"AccessKey":_k2},body:f});
   if(res.ok){s.innerText="✅ FINAL HO GAYA! Bunny me upload success";}else{throw new Error(res.status+" - Storage Name check karo")}
 }catch(e){s.style.color="red";s.innerText="Fail: "+e.message}
}
</script>
</body>
</html>
