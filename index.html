<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix</title>
<style>
body{margin:0;background:#000;display:flex;justify-content:center;font-family:Arial}
.box{width:390px;background:#fff;min-height:100vh;padding-bottom:80px}
.top{padding:10px;display:flex;align-items:center;gap:8px}
.logo{font-size:22px;font-weight:900}
.logo b{color:#FF7A00}
.logo f{color:green}
.video{margin:10px;background:#000;height:200px;border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center}
.video img{width:100%;height:100%;object-fit:cover;border-radius:12px;opacity:0.7}
.play{position:absolute;width:60px;height:60px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
.title{padding:10px;font-weight:700}
.channel{padding:0 10px;display:flex;align-items:center;gap:8px}
.cicon{width:30px;height:30px;background:blue;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sub{margin-left:auto;background:#000;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px}
.row{display:flex;gap:8px;padding:10px;overflow:auto}
.btn{background:#eee;padding:8px 12px;border-radius:10px;font-size:12px}
.next{padding:10px;border-top:1px solid #eee;margin-top:10px}
.item{display:flex;gap:10px;margin-bottom:10px}
.thumb{width:120px;height:70px;background:#000;border-radius:8px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.bottom{position:fixed;bottom:0;width:390px;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ccc}
</style>
</head>
<body>
<div class="box">
<div class="top">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" width="28">
<div class="logo"><b>Bharat</b> <f>Flix</f></div>
</div>

<div class="video">
<img src="https://images.unsplash.com/photo-1548013146-72479768bada?w=800">
<div class="play">▶️</div>
</div>

<div class="title">Bharat Flix Aapka Apna Swadeshi Platform 🇮🇳</div>

<div class="channel">
<div class="cicon">M</div>
<div><b style="font-size:13px">Media App ✔</b><br><span style="font-size:10px;color:#666">1.2M subscribers</span></div>
<div class="sub">Subscribe</div>
</div>

<div class="row">
<div class="btn">👍 Like</div>
<div class="btn">👎 Dislike</div>
<div class="btn">↗️ Share</div>
<div class="btn">⬇️ Download</div>
<div class="btn">🔖 Save</div>
</div>

<div class="next">
<b>Up next</b>
<div class="item">
<div class="thumb"><img src="https://images.unsplash.com/photo-1587474260584-136574528ed5?w=400"></div>
<div><b style="font-size:12px">Red Fort Delhi Tour</b><br><span style="font-size:10px">820K views</span></div>
</div>
<div class="item">
<div class="thumb"><img src="https://images.unsplash.com/photo-1529253355930-ddbe423a2ac7?w=400"></div>
<div><b style="font-size:12px">Gateway of India Mumbai</b><br><span style="font-size:10px">540K views</span></div>
</div>
<div class="item">
<div class="thumb"><img src="https://images.unsplash.com/photo-1561361058-c24cecae35ca?w=400"></div>
<div><b style="font-size:12px">Varanasi Ganga Aarti</b><br><span style="font-size:10px">1.1M views</span></div>
</div>
</div>

<div class="bottom">
<div>⌂ Home</div>
<div>◫ Shorts</div>
<div>+</div>
<div>◧ Subs</div>
<div>▭ Library</div>
</div>

</div>
</body>
</html>
