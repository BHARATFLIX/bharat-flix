<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BharatFlix v53 OLD HEADER</title><link rel="icon" href="logo.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}body{max-width:480px;margin:0 auto;background:#fff;padding-bottom:70px}
.header{position:sticky;top:0;z-index:1004;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}

.h-icons{display:flex;gap:2px}.hi{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}.hi.bell{position:relative}.badge{position:absolute;top:-2px;right:-2px;background:#f00;color:#fff;font-size:10px;padding:1px 5px;border-radius:10px;font-weight:700}
.chips{position:sticky;top:55px;z-index:1003;background:#fff;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;white-space:nowrap;border-bottom:1px solid #eee;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;background:#f2f2f2;border-radius:8px;font-size:14px;font-weight:500;border:1px solid #e5e5e5;flex:0 0 auto;cursor:pointer}.chip.active{background:#0f0f0f;color:#fff}
.chip.compass{padding:6px 12px;font-size:18px;display:flex;align-items:center}
#drawer{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:rgba(0,0,0,.4);z-index:15000;display:none}
.drawer-box{width:75%;max-width:300px;height:100%;background:#fff;overflow-y:auto;animation:s .25s}@keyframes s{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.d-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}
.d-item{display:flex;align-items:center;gap:24px;padding:14px 18px;font-size:15px;cursor:pointer}.d-item:active{background:#f2f2f2}.d-i{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:20px}
.d-sep{height:1px;background:#e5e5e5;margin:8px 0}.d-foot{padding:16px;color:#606060;font-size:12px;text-align:center}
.feed{background:#fff}.v-card{border-bottom:8px solid #f2f2f2}.v-thumb{width:100%;aspect-ratio:16/9;background:#000}.v-thumb video{width:100%;height:100%;object-fit:cover}
.v-info{padding:10px 12px;display:flex;gap:10px}.v-ava{width:36px;height:36px;border-radius:50%;background:#eee;overflow:hidden;flex-shrink:0}.v-ava img{width:100%;height:100%;object-fit:cover}.v-txt b{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}.v-meta{font-size:11px;color:#606060;margin-top:4px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;padding:6px 0;z-index:998}.bt{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#606060;padding:4px 12px}.bt.active{color:#000;font-weight:600}.bt .ic{font-size:22px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;display:none;z-index:9999}
#playerPage{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:#fff;z-index:11000;display:none;flex-direction:column}
</style></head><body>
<!-- पुराना वाला ORIGINAL HEADER -->

<script>
const SUPA_URL="https://dvaawuhwetwmmziucyow.supabase.co",SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2YWF3dWh3ZXR3bW16aXVjeW93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MjM2NDcsImV4cCI6MjEwOTI5OTY0N30.2tqmnZbn_4_LKSet1JPKdTNKpzgy6y_i03V_AajCktI";
let supa=null;try{supa=supabase.createClient(SUPA_URL,SUPA_KEY)}catch(e){}
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}
let allVideos=[];
async function load(){try{let {data}=await supa.from('videos').select('*').order('created_at',{ascending:false}).limit(30);allVideos=data||[];render()}catch(e){render()}}
function render(){let f=document.getElementById('feed');if(!allVideos.length){f.innerHTML='<div style="padding:40px;text-align:center">🇮🇳<br>Video डालो</div>';return}f.innerHTML='';allVideos.forEach(v=>{let d=document.createElement('div');d.className='v-card';d.innerHTML=`<div class="v-thumb"><video src="${v.video_url}" muted></video></div><div class="v-info"><div class="v-ava"><img src="logo.png"></div><div class="v-txt"><b>${v.title}</b><div class="v-meta">${v.category||'BharatFlix'} • 59K • 10h ago</div></div></div>`;d.onclick=()=>{let p=document.getElementById('playerPage');document.getElementById('myVideo').src=v.video_url;document.getElementById('pTitle').innerText=v.title;p.style.display='flex';setTimeout(()=>document.getElementById('myVideo').play().catch(()=>{}),200)};f.appendChild(d)})}
load();
// COMPASS OPEN - यही आपका सूचक वाला बटन
document.getElementById('compassBtn').onclick=()=>{document.getElementById('drawer').style.display='block'};

// Drawer item click
document.querySelectorAll('.d-item').forEach(i=>{i.onclick=()=>{let m=i.dataset.m;document.getElementById('drawer').style.display='none';if(m){toast('📁 '+m)}else{toast(i.innerText.trim())}}});
document.getElementById('closeP').onclick=()=>{document.getElementById('playerPage').style.display='none';document.getElementById('myVideo').pause()};
document.getElementById('bellBtn').onclick=()=>toast('🔔 9+ Notifications');
document.getElementById('setBtn').onclick=()=>toast('⚙️ v53 Old Header - No Install');
</script></body></html>
