<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff;padding-bottom:80px}
.header{position:sticky;top:0;z-index:999;background:#fff;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);border-radius:0 0 16px 16px}
.top{display:flex;align-items:center;gap:10px}
/* सोने वाली मूर्ति - गोल्डन */
.gold{
  width:60px;height:74px;flex-shrink:0;
  background:linear-gradient(to bottom,#FFEB3B,#FFC107,#FF9800);
  -webkit-mask:url('https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg') no-repeat center/contain;
  mask:url('https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg') no-repeat center/contain;
  filter:drop-shadow(0 2px 4px #FF8F00);
}
.logo{font-size:34px;font-weight:900}
.logo span:nth-child(1){color:#ff7a00} .logo span:nth-child(2){color:#111} .logo span:nth-child(3){color:#0fb000}
/* दूसरा रो - छोटा ताकि कटे नहीं */
.row2{display:flex;gap:5px;margin-top:8px;overflow-x:auto}
.row2::-webkit-scrollbar{display:none}
.p{height:34px;min-width:42px;background:#eee;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;border:none}
.p.b{width:34px;background:#1a73e8;color:#fff;border-radius:50%;font-weight:800}
.p.i{background:#ff6a00;color:#fff;font-size:12px;font-weight:700;padding:0 14px;min-width:66px}

.video{margin:10px;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#000;position:relative}
.video img{width:100%;height:100%;object-fit:cover}
/* प्ले बटन बीच में */
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;background:rgba(0,0,0,.65);border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}

.sw{margin:8px 10px;padding:8px 12px;background:#FFF3E0;border-left:4px solid #ff6a00;border-radius:8px;font-weight:700;font-size:14px}
.sw g{color:#0fb000}

.actions{display:flex;gap:5px;padding:8px 10px;overflow-x:auto}
.actions::-webkit-scrollbar{display:none}
.actions button{height:32px;padding:0 10px;background:#f1f1f1;border:none;border-radius:16px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
.actions button.bl{background:#dbeaff;color:#065fd4;border:1px solid #3ea6ff}
.actions button.bk{background:#000;color:#fff}

.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:6px 0;z-index:999;border-radius:18px 18px 0 0}
.bi{font-size:10px;text-align:center;color:#666}.plus{width:56px;height:38px;background:#ff6a00;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
</style>
</head>
<body>

<div class="header">
  <div class="top"><div class="gold"></div><div class="logo"><span>Bha</span><span>rat</span><span>Flix</span></div></div>
  <!-- Search > Notification > Setting > Install > Profile B -->
  <div class="row2">
    <div class="p">🔍</div>
    <div class="p">🔔</div>
    <div class="p">⚙️</div>
    <button class="p i">Install</button>
    <div class="p b">B</div>
  </div>
</div>

<div class="video">
  <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800">
  <div class="play">▶</div>
  <div style="position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;display:flex;gap:8px;font-size:11px"><span>0:42</span><div style="flex:1;height:3px;background:#ffffff66;margin-top:6px;border-radius:2px"><div style="width:40%;height:100%;background:red"></div></div><span>-32:18</span></div>
  <div style="position:absolute;top:6px;right:6px;background:#000;color:#fff;font-size:10px;padding:3px 6px;border-radius:5px">4K • HDR</div>
</div>

<div class="sw">BharatFlix - आपका अपना <g>स्वदेशी प्लेटफॉर्म</g> 🇮🇳</div>

<div style="padding:0 10px;font-weight:700;font-size:14px">Himalayan Peaks | Travel Through Himachal | Nature Documentary in 4K</div>
<div style="padding:2px 10px;color:#666;font-size:12px">2.4M views • 3 days ago</div>

<div style="display:flex;justify-content:space-between;padding:10px">
  <div style="display:flex;gap:8px;align-items:center"><div class="p b">B</div><b style="font-size:13px">BharatFlix • 1.2M</b></div>
  <button style="background:#000;color:#fff;border:none;padding:6px 16px;border-radius:18px;font-weight:700;font-size:13px">Subscribe</button>
</div>

<div class="actions">
  <button>👍 12K</button><button>👎</button><button>↗️ Share</button><button>✨ Remix</button><button>⬇️ Download</button><button>✂️ Clip</button><button>🔖 Save</button><button>🚩 Report</button>
  <button class="bl">🎁 Super Thanks</button><button class="bl">💎 Thanks</button><button class="bk">⭐ Join</button>
</div>

<div class="bottom">
  <div class="bi">🏠<br>Home</div><div class="bi">🎞️<br>Shorts</div><div class="bi"><div class="plus">+</div></div><div class="bi">📺<br>Subs</div><div class="bi">👤<br>You</div>
</div>

</body>
</html>
