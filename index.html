<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatFlix</title>

<!-- ये है वो लिंक भैया जी, ये आपकी look.css को index में चलाएगा -->
<link rel="stylesheet" href="look.css">

</head>
<body>

<div class="header">
  <div class="logo">BharatFlix</div>
  <div class="profile">👤</div>
</div>

<!-- आपका चलने वाला वीडियो बैकग्राउंड -->
<div class="video">
  <video autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;">
    <source src="mov_bbb.mp4" type="video/mp4">
  </video>
  <div class="play">▶</div>
</div>

<!-- आपके 12 बटन, अब look नहीं कटेगी -->
<div class="swipe">
  <div>👍 Like</div><div>👎 12K</div><div>↗️ Share</div>
  <div>⬇️ Download</div><div>🔖 Save</div>
</div>

</body>
</html>
