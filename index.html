<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BharatFlix</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;font-family:system-ui;background:#f5f5f5}
.page{display:none;min-height:100vh}
.page.active{display:flex;align-items:center;justify-content:center}
#page-install.active,#page-gate.active{flex-direction:column;background:linear-gradient(to bottom,#FF9933,white,#138808)}
.card{background:white;padding:25px;border-radius:20px;box-shadow:0 10px 30px #0003;width:85%;max-width:340px;text-align:center}
button.main{width:100%;padding:15px;background:linear-gradient(90deg,#b8962e,#ffd700);color:black;font-weight:bold;font-size:18px;border:2px solid gold;border-radius:12px;margin-top:12px}
input{width:90%;padding:12px;margin:6px;border:1px solid #ccc;border-radius:10px}
header{background:#0a0a2a;padding:12px;display:flex;align-items:center;gap:10px;color:white;width:100%;box-sizing:border-box}
.ad{margin:15px;padding:20px;border:2px dashed #d4af37;border-radius:15px;background:white;text-align:center;width:90%}
.video{margin:15px;border-radius:18px;padding:12px;background:linear-gradient(to bottom,#FF9933,white,#138808);width:90%}
video{width:100%;border-radius:12px}
.row{background:white;border:2px solid gold;margin:10px 0;padding:12px;border-radius:12px}
</style>
</head>
<body>

<!-- 1. INSTALL PAGE -->
<div id="page-install" class="page active">
  <div class="card">
    <img src="logo.png" width="110" style="border-radius:18px;border:3px solid gold">
    <h2>BHARAT FLIX</h2>
    <p>भारत का अपना OTT<br>100% FREE</p>
    <button class="main" id="installBtn">🇮🇳 FREE Install करो</button>
    <button class="main" style="background:black;color:white" onclick="goGate()">बिना Install देखो</button>
  </div>
</div>

<!-- 2. ZERO PAISE GATE -->
<div id="page-gate" class="page">
  <div class="card">
    <img src="logo.png" width="80" style="border-radius:12px;border:2px solid gold">
    <h3>Zero Paise - Gate Pass</h3>
    <input id="name" placeholder="आपका नाम">
    <input id="mobile" placeholder="मोबाइल नंबर">
    <input id="gmail" placeholder="Gmail (optional)">
    <button class="main" style="background:black;color:white" onclick="enterApp()">Gate Pass बनाओ</button>
  </div>
</div>

<!-- 3. HOME PAGE -->
<div id="page-home" class="page" style="flex-direction:column;justify-content:flex-start">
  <header><img src="logo.png" width="45" style="border-radius:8px"><b>BHARAT FLIX</b>
    <button onclick="showTop()" style="margin-left:auto;padding:6px 10px;border-radius:6px">Top List</button>
  </header>

  <div class="ad"><b style="color:#b8962e">Ad Space - Yahan Ad Aayega</b><br><small>₹500 / दिन</small></div>

  <div class="video"><video controls onplay="addView('v1','Raju Bhai')" poster="" src="https://www.w3schools.com/html/mov_bbb.mp4"></video><b>Bharat Ke Veer</b><br><small id="vc1">0 views</small></div>
  <div class="video"><video controls onplay="addView('v2','Pappu Bhai')" src="https://www.w3schools.com/html/mov_bbb.mp4"></video><b>Street Food India</b><br><small id="vc2">0 views</small></div>

  <div id="topArea" style="width:90%;display:none"><h2>🏆 Top Viral List</h2><div id="list"></div><button class="main" style="background:black;color:white" onclick="hideTop()">वापस जाओ</button></div>
</div>

<script>
// PAGE SWITCH
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goGate(){showPage('page-gate');}
function enterApp(){
  let n=document.getElementById('name').value,m=document.getElementById('mobile').value;
  if(!n||!m){alert("भैया जी नाम मोबाइल भर दो");return;}
  localStorage.setItem('bharatflix_user',JSON.stringify({name:n,mobile:m}));
  showPage('page-home'); loadCounts();
}
function addView(id,creator){
  let s=JSON.parse(localStorage.getItem('bharat_stats')||'{}');
  if(!s[id])s[id]={views:0,creator:creator}; s[id].views+=1;
  localStorage.setItem('bharat_stats',JSON.stringify(s)); loadCounts();
}
function loadCounts(){
  let s=JSON.parse(localStorage.getItem('bharat_stats')||'{}');
  if(s['v1'])document.getElementById('vc1').innerText=s['v1'].views+" views";
  if(s['v2'])document.getElementById('vc2').innerText=s['v2'].views+" views";
}
function showTop(){
  let s=JSON.parse(localStorage.getItem('bharat_stats')||'{}');
  let sorted=Object.entries(s).sort((a,b)=>b[1].views-a[1].views);
  document.getElementById('topArea').style.display='block';
  document.getElementById('list').innerHTML=sorted.length==0?"<p>अभी कोई व्यू नहीं भैया जी</p>":sorted.map((v,i)=>`<div class="row"><h3>${i==0?'🥇':i==1?'🥈':'🏅'} #${i+1} - ${v[1].views} Views</h3><p>${v[0]} - ${v[1].creator}</p></div>`).join('');
  window.scrollTo(0,document.body.scrollHeight);
}
function hideTop(){document.getElementById('topArea').style.display='none';}

// AUTO LOGIN
if(localStorage.getItem('bharatflix_user')){showPage('page-home'); loadCounts();}

// PWA INSTALL
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
document.getElementById('installBtn').onclick=async()=>{
  if(deferredPrompt){deferredPrompt.prompt(); await deferredPrompt.userChoice;}
  goGate();
};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
