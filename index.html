.video{margin:6px 8px 6px;border-radius:12px;overflow:hidden;aspect-ratio:16/8.2;background:#000;position:relative}
.video img{width:100%;height:100%;object-fit:cover}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}

.actions{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;white-space:nowrap}.actions::-webkit-scrollbar{display:none}
.actions button{height:30px;padding:0 10px;border:none;border-radius:16px;background:#f2f2f2;font-size:11.5px;font-weight:600;flex-shrink:0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;padding:6px 0 4px;border-radius:16px 16px 0 0;z-index:999}
.bi{font-size:10px;text-align:center;color:#606060}.bi.ac{color:#0f0f0f;font-weight:700}
.up{padding:8px}.card{display:flex;gap:8px;margin-bottom:10px}

.th s{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.8);color:#fff;font-size:10px;padding:1px 4px;border-radius:3px;font-style:normal}
