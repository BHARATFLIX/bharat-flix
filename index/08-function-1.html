<script>
const SUPABASE_URL="https://YOUR-PROJECT.supabase.co";
const SUPABASE_KEY="YOUR-ANON-KEY";
let supabaseClient=null;
if(window.supabase){ supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }

let allVideos=[];
let filteredVideos=[];

function searchVideos(q){
q=(q||'').toLowerCase();
if(!q){ renderHome(allVideos); return; }
let f=allVideos.filter(v=>(v.title||'').toLowerCase().includes(q)||(v.channel||'').toLowerCase().includes(q));
renderHome(f);
}

async function loadVideos(){
try{
if(supabaseClient){
let {data}=await supabaseClient.from('videos').select('*').order('created_at',{ascending:false});
if(data && data.length){ allVideos=data; }
}
}catch(e){}
if(!allVideos.length){
allVideos=[
{title:"Bhojpuri Song - Sample",channel:"BhojFlix Music",views:"1.2K",likes:120,thumb:"",url:"",isShort:false},
{title:"Comedy Short - Sample",channel:"BhojFlix Comedy",views:"5K",likes:300,thumb:"",url:"",isShort:true}
];
}
if(currentCat && currentCat!='all'){
filteredVideos=allVideos.filter(v=>(v.category||'all')==currentCat || v.isShort && currentCat=='shorts');
}else{ filteredVideos=allVideos; }
renderHome(filteredVideos);

}
</script>
