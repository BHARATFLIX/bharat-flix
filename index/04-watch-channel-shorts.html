<!-- 04-watch-channel-shorts.html -->
<style>
.homeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
@media(min-width:700px){.homeGrid{grid-template-columns:1fr 1fr 1fr 1fr}}
.vCard{background:#111;border-radius:12px;overflow:hidden;cursor:pointer}
.vCard img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}
.vCard .vInfo{padding:8px}
.vCard b{font-size:13px;display:block}
.vCard small{color:#aaa}
.shortsRow{display:flex;gap:10px;overflow-x:auto;padding:10px}
.shortCard{min-width:150px;background:#111;border-radius:12px;overflow:hidden;cursor:pointer}
.shortCard img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#222}
.chanHead{padding:14px;text-align:center}
.chanHead img{width:80px;height:80px;border-radius:50%;background:#333}
</style>

<!-- HOME LIST -->
<div id="homeSection">
<div class="shortsRow" id="shortsRow"></div>
<div class="homeGrid" id="homeGrid"></div>
</div>

<!-- CHANNEL PAGE -->
<div id="channelPage" style="display:none">
<div class="chanHead">
<img id="chImg" src="">
<h2 id="chName">Channel Name</h2>
<p id="chSubs" style="color:#aaa">0 Subscribers • 0 Videos</p>
<button class="subBtn" id="chSubBtn" onclick="subscribeChan()">Subscribe</button>
</div>
<div class="homeGrid" id="chVideos"></div>
</div>

<!-- SHORTS FEED -->
<div id="shortsFeed" style="display:none">
<div id="shortPlayerBox" style="max-width:420px;margin:0 auto"></div>
</div>

<script>
function renderHome(list){
let g=document.getElementById('homeGrid'); g.innerHTML='';
list.forEach(v=>{
let d=document.createElement('div'); d.className='vCard';
d.onclick=()=>openWatch(v);
d.innerHTML='<img src="'+(v.thumb||'')+'"><div class="vInfo"><b>'+v.title+'</b><small>'+v.channel+' • '+v.views+' views</small></div>';
g.appendChild(d);
});
}
function renderShorts(list){
let r=document.getElementById('shortsRow'); r.innerHTML='';
list.filter(v=>v.isShort).forEach(v=>{
let d=document.createElement('div'); d.className='shortCard';
d.onclick=()=>openShort(v);
d.innerHTML='<img src="'+(v.thumb||'')+'"><div style="padding:8px"><b style="font-size:12px">'+v.title+'</b></div>';
r.appendChild(d);
});
}
function openWatch(v){ loadPlayer(v); document.getElementById('playerWrap').scrollIntoView({behavior:'smooth'}); }
function openShort(v){ loadPlayer(v); }
function openChannel(ch){
document.getElementById('homeSection').style.display='none';
document.getElementById('channelPage').style.display='block';
document.getElementById('chName').innerText=ch.name||'Channel';
document.getElementById('chSubs').innerText=(ch.subs||0)+' Subscribers';
}
function goHome(){
document.getElementById('channelPage').style.display='none';
document.getElementById('shortsFeed').style.display='none';
document.getElementById('homeSection').style.display='block';
}
function openFirstShort(){
document.getElementById('homeSection').style.display='none';
document.getElementById('shortsFeed').style.display='block';
}
</script>
