<form id="myForm">
  <input type="text" id="name" placeholder="आपका नाम" required>
  <input type="tel" id="mobile" placeholder="मोबाइल नंबर" required>
  <input type="email" id="email" placeholder="ईमेल">
  <input type="file" id="photo" accept="image/*" required>
  <button type="submit">पूरा करो और आगे बढ़ो</button>
</form>

<script>
const SCRIPT_URL = "YAHAN_DEPLOY_LINK_DALO";
const HOME_URL = "index.html"; // भैया जी यहाँ अपने होम पेज का नाम लिख दो

let p64="", pMime="", pName="";
document.getElementById('photo').addEventListener('change', e=>{
  let f=e.target.files[0]; pName=f.name; pMime=f.type;
  let r=new FileReader(); r.onload=ev=>p64=ev.target.result; r.readAsDataURL(f);
});

document.getElementById('myForm').addEventListener('submit', e=>{
  e.preventDefault();
  fetch(SCRIPT_URL, {method:'POST', body: JSON.stringify({action:"add", name:document.getElementById('name').value, mobile:document.getElementById('mobile').value, email:document.getElementById('email').value, photoBase64:p64, photoMime:pMime, photoName:pName}) })
 .then(()=>{
    // भैया जी सब पूरा होते ही अगली खिड़की खुलेगी और होम पर चला जाएगा
    window.open(HOME_URL, "_blank"); // अगली खिड़की खुलेगी
    window.location.href = HOME_URL; // और यही वाला भी होम पर चला जाएगा
  });
});
</script>
